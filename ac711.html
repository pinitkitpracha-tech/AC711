<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ============================================================
   AC711 ระบบบริหารร้านอะไหล่และสาขา — Design System
   โทน: ส้ม–เทาอ่อน | เตือน = แดง | กรอบขนาดคงที่ ไม่ขึ้นกับความยาวข้อความ
   ============================================================ */
:root{
  --bg:#f3f4f6; --bg2:#eceef1; --panel:#ffffff; --panel2:#f7f8fa; --panel3:#eef0f3;
  --line:#dfe2e7; --line2:#c9ced6;
  --text:#1f2329; --muted:#5f6772; --dim:#8a919b;
  --amber:#f97316; --amber2:#ea580c; --amber-ink:#ffffff; --amber-soft:rgba(249,115,22,.12);
  --red:#dc2626; --red-soft:rgba(220,38,38,.12); --green:#16a34a; --green-soft:rgba(22,163,74,.12); --blue:#2563eb; --blue-soft:rgba(37,99,235,.12);
  --r:0.9333rem; --r-sm:0.6667rem; --shadow:0 0.6667rem 1.8667rem rgba(31,35,41,.10);
  --side:15.7333rem; --top:4rem; --bottom:4.2667rem;
  --hazard:repeating-linear-gradient(-45deg,var(--amber) 0 0.6667rem,#e5e7eb 0.6667rem 1.3333rem);
  --font:'Prompt',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
@media(max-width:26.25em){html{font-size:87.5%}}   /* มือถือจอเล็ก 14px */
@media(min-width:112.5em){html{font-size:106.25%}}  /* จอใหญ่ 17px */
html{font-size:93.75%;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:0.6rem;height:0.6rem}::-webkit-scrollbar-thumb{background:#c9ced6;border-radius:0.6rem}::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:0.4rem}
[hidden]{display:none!important}
.hazard{height:0.3333rem;background:var(--hazard)}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:1.3333rem;background:radial-gradient(60rem 33.3333rem at 80% -10%,rgba(249,115,22,.18),transparent 60%),var(--bg)}
.login .box{width:100%;max-width:28rem;background:var(--panel);border:1px solid var(--line);border-radius:1.3333rem;padding:2rem 1.8667rem;box-shadow:var(--shadow);position:relative;overflow:hidden}
.login .box::before{content:'';position:absolute;inset:0 0 auto 0;height:0.4rem;background:var(--hazard)}
.brand{display:flex;align-items:center;gap:0.8rem}
.brand .mark{width:3.0667rem;height:3.0667rem;border-radius:0.8rem;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-weight:800;font-size:1.1333rem;flex:none;letter-spacing:.02em}
.brand b{font-size:1.2rem;display:block;line-height:1.2}.brand small{color:var(--muted);font-size:0.8rem;letter-spacing:.12em}
.login .hint{font-size:0.8333rem;color:var(--muted);margin-top:0.9333rem;line-height:1.6}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:var(--top) 1fr;min-height:100vh}
.topbar{grid-column:1/-1;position:sticky;top:0;z-index:40;height:var(--top);background:#ffffff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:0.6667rem;padding:0 0.9333rem}
.topbar .brand .mark{width:2.4rem;height:2.4rem;font-size:0.8667rem;border-radius:0.6667rem}.topbar .brand b{font-size:1rem}.topbar .brand small{display:none}
.topbar .grow{flex:1;min-width:0}
.branch-pick{height:2.5333rem;border:1px solid var(--line2);background:var(--panel2);border-radius:0.6667rem;padding:0 0.6667rem;max-width:14.6667rem;color:var(--text)}
.iconbtn{position:relative;width:2.6667rem;height:2.6667rem;border-radius:0.6667rem;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--text);font-size:1.2rem;flex:none}
.iconbtn:hover{border-color:var(--amber)}
.iconbtn .n{position:absolute;top:-0.4rem;right:-0.4rem;min-width:1.2rem;height:1.2rem;border-radius:0.6rem;background:var(--red);color:#fff;font-size:0.7333rem;font-weight:700;display:grid;place-items:center;padding:0 0.2667rem}
.userchip{display:flex;align-items:center;gap:0.5333rem;height:2.6667rem;padding:0 0.6667rem 0 0.2667rem;border:1px solid var(--line);border-radius:0.8rem;background:var(--panel);cursor:pointer;max-width:14.6667rem}
.userchip .av{width:2rem;height:2rem;border-radius:0.6rem;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-weight:800;font-size:0.8667rem;flex:none}
.userchip .t{min-width:0}.userchip b{display:block;font-size:0.8667rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}.userchip span{font-size:0.7333rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.side{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;background:#ffffff;border-right:1px solid var(--line);padding:0.8rem 0.6667rem 1.3333rem}
.side .grp{font-size:0.7333rem;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;padding:0.9333rem 0.8rem 0.4rem;font-weight:700}
.side a{display:flex;align-items:center;gap:0.7333rem;height:2.9333rem;padding:0 0.8rem;border-radius:0.7333rem;color:var(--muted);font-weight:500;font-size:0.9333rem;white-space:nowrap;overflow:hidden}
.side a .ic{width:1.6rem;text-align:center;font-size:1.1333rem;flex:none}.side a .lb{overflow:hidden;text-overflow:ellipsis}
.side a .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:0.7333rem;font-weight:700;border-radius:0.6rem;min-width:1.3333rem;height:1.3333rem;display:grid;place-items:center;padding:0 0.3333rem}
.side a:hover{background:var(--panel);color:var(--text)}.side a.on{background:var(--amber);color:var(--amber-ink);font-weight:700}
.side a.on .cnt{background:var(--amber-ink);color:var(--amber)}
.main{padding:1.2rem 1.3333rem 6rem;min-width:0}
.bottomnav{display:none}
@media(max-width:68.75em){:root{--side:13.3333rem}}
@media(max-width:53.75em){
  .shell{grid-template-columns:1fr}.side{display:none}
  .main{padding:0.9333rem 0.8rem calc(var(--bottom) + 1.6rem)}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:var(--bottom);background:#ffffff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:0.7333rem;position:relative}
  .bottomnav a .ic{font-size:1.3333rem}.bottomnav a.on{color:var(--amber)}
  .bottomnav a .cnt{position:absolute;top:0.4rem;right:calc(50% - 1.4667rem);background:var(--red);color:#fff;font-size:0.6667rem;font-weight:700;border-radius:0.5333rem;min-width:1.0667rem;height:1.0667rem;display:grid;place-items:center;padding:0 0.2667rem}
  .topbar .brand b{display:none}.userchip .t{display:none}.userchip{padding:0 0.2667rem}.branch-pick{max-width:9.3333rem}
}
/* เมนูทั้งหมดบนมือถือ (sheet) */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(31,35,41,.45);display:none}
.sheet.open{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow-y:auto;background:var(--panel);border-radius:1.3333rem 1.3333rem 0 0;padding:0.9333rem 0.9333rem calc(1.3333rem + env(safe-area-inset-bottom));border-top:1px solid var(--line2)}
.sheet .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.5333rem}
.sheet a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.4rem;height:5.2rem;border-radius:0.8rem;background:var(--panel2);border:1px solid var(--line);font-size:0.7667rem;color:var(--text);text-align:center;padding:0.2667rem;overflow:hidden}
.sheet a .ic{font-size:1.4667rem}.sheet a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.sheet a.on{border-color:var(--amber);background:var(--amber-soft)}

/* ---------- Page header ---------- */
.ph{display:flex;align-items:center;gap:0.8rem;margin-bottom:1.0667rem;flex-wrap:wrap}
.ph h1{font-size:1.4667rem;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ph .sub{font-size:0.8667rem;color:var(--muted);width:100%}
.ph .act{margin-left:auto;display:flex;gap:0.5333rem;flex-wrap:wrap}
@media(max-width:37.5em){.ph h1{font-size:1.2667rem}.ph .act{margin-left:0;width:100%}.ph .act .btn{flex:1}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5333rem;height:2.8rem;padding:0 1.0667rem;border-radius:0.7333rem;border:1px solid transparent;font-weight:600;font-size:0.9333rem;cursor:pointer;white-space:nowrap;transition:transform .1s,filter .15s;background:var(--panel2);color:var(--text);border-color:var(--line2);user-select:none}
.btn{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.98)}
.btn.amber{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.ghost{background:transparent}.btn.ghost.red{color:var(--red);border-color:rgba(220,38,38,.45)}.btn.ghost.red:hover{background:var(--red-soft)}
.btn.sm{height:2.2667rem;padding:0 0.8rem;font-size:0.8667rem;border-radius:0.6rem}
.btn.lg{height:3.4667rem;font-size:1.0667rem;padding:0 1.4667rem;border-radius:0.9333rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn .ic{font-size:1.1333rem}

/* ---------- Cards / boxes (ขนาดคงที่) ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.0667rem;position:relative;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:1rem;font-weight:700;margin-bottom:0.6667rem;display:flex;align-items:center;gap:0.5333rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3 .r{margin-left:auto;font-weight:500;font-size:0.8333rem;color:var(--muted)}
.card.h-fixed{height:24rem;display:flex;flex-direction:column}.card.h-fixed .body{flex:1;overflow:auto;min-height:0}
.grid{display:grid;gap:0.9333rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.grid>*{min-width:0}.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media(max-width:68.75em){.g4,.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g-2-1,.g-1-2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:47.5em){.g3,.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:30em){.g2{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{height:7.4667rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0.9333rem 1.0667rem;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;min-width:0}
.kpi .lb{font-size:0.8333rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:0.4rem}
.kpi .v{font-size:1.7333rem;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.kpi .d{font-size:0.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d.up{color:var(--green)}.kpi .d.down{color:var(--red)}
.kpi.amber{background:linear-gradient(135deg,rgba(249,115,22,.22),rgba(249,115,22,.06));border-color:rgba(249,115,22,.45)}
.kpi.red{border-color:rgba(229,57,53,.6);background:linear-gradient(135deg,rgba(229,57,53,.2),rgba(229,57,53,.04))}
.kpi .ico{position:absolute;right:0.9333rem;top:0.8rem;font-size:1.4667rem;opacity:.55}
.g6 .kpi .v{font-size:1.4rem}
@media(max-width:30em){.kpi{height:6.4rem;padding:0.8rem}.kpi .v{font-size:1.3333rem}.kpi .ico{font-size:1.1333rem;right:0.6667rem;top:0.6rem}}
.acard{display:flex;flex-direction:column;min-height:15.3333rem;gap:0.1333rem}
.acard .acts{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:auto;padding-top:0.8rem}.acard .acts .btn{flex:1 1 auto;min-width:0}.acard .acts .btn[data-view]{flex-basis:100%}
@media(max-width:37.5em){.acards{grid-template-columns:1fr}.acard{min-height:0}}
.tile{height:10rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0.9333rem;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;min-width:0}
.tile:hover{border-color:var(--amber);transform:translateY(-2px)}
.tile .t{font-weight:700;font-size:0.9667rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:2.7em}
.tile .s{font-size:0.8333rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:0.2667rem}
.tile .f{margin-top:auto;display:flex;align-items:center;gap:0.5333rem;font-size:0.8667rem;white-space:nowrap;overflow:hidden}
.tile .f b{font-size:1.0667rem}
.tile .ic{width:2.5333rem;height:2.5333rem;border-radius:0.6667rem;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;font-size:1.2667rem;margin-bottom:0.5333rem;flex:none}
.pcard{height:16.6667rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;min-width:0}
.pcard:hover{border-color:var(--amber)}
.pcard .ph{height:8.5333rem;background:var(--panel2);display:grid;place-items:center;position:relative;margin:0;flex:none}
.pcard .ph img{width:100%;height:100%;object-fit:cover}.pcard .ph .no{font-size:2.2667rem;opacity:.35}
.pcard .ph .sku{position:absolute;left:0.5333rem;top:0.5333rem;background:rgba(0,0,0,.7);color:var(--amber);font-size:0.7rem;font-weight:700;border-radius:0.4rem;padding:2px 0.4667rem;letter-spacing:.04em;max-width:calc(100% - 1.0667rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .ph .qb{position:absolute;right:0.5333rem;top:0.5333rem;font-size:0.7333rem;font-weight:700;border-radius:0.4rem;padding:2px 0.4667rem;background:var(--green-soft);color:var(--green)}
.pcard .ph .qb.low{background:var(--red-soft);color:var(--red)}
.pcard .b{padding:0.6667rem 0.8rem;display:flex;flex-direction:column;flex:1;min-height:0}
.pcard .n{font-size:0.9rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:2.7em}
.pcard .p{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:0.4rem;white-space:nowrap;overflow:hidden}
.pcard .p b{font-size:1.0667rem;color:var(--amber2)}.pcard .p span{font-size:0.7667rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.2rem,1fr));gap:0.8rem}
@media(max-width:30em){.grid-p{grid-template-columns:repeat(2,1fr);gap:0.6rem}.pcard{height:15.4667rem}.pcard .ph{height:7.4667rem}}

/* ---------- Lists / tables (แถวสูงคงที่) ---------- */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:0.8rem;height:4rem;padding:0 0.9333rem;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:none}
.row.click{cursor:pointer}.row.click:hover{background:var(--panel2)}
.row .ic{width:2.5333rem;height:2.5333rem;border-radius:0.6667rem;background:var(--panel2);display:grid;place-items:center;font-size:1.1333rem;flex:none;overflow:hidden}
.row .ic img{width:100%;height:100%;object-fit:cover}
.row .m{flex:1;min-width:0}.row .m>b{display:block;font-size:0.9333rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}.row .m>span{display:block;font-size:0.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .e{text-align:right;flex:none;max-width:40%}.row .e>b{display:block;font-size:0.9667rem;white-space:nowrap}.row .e>span{font-size:0.7667rem;color:var(--muted);white-space:nowrap;display:block}.row .e .pill{display:inline-flex;font-size:0.7667rem}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;font-size:0.9rem}
.tbl th{font-size:0.7667rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0.6667rem 0.8rem;border-bottom:1px solid var(--line2);background:var(--panel2);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:0 0.8rem;height:3.3333rem;border-bottom:1px solid var(--line);white-space:nowrap;max-width:18.6667rem;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.tbl tr:hover td{background:var(--panel2)}.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}
.tbl.stmt td{white-space:normal;max-width:none}.tbl.stmt td:first-child{min-width:12rem}
.tbl input,.tbl select{height:2.2667rem;padding:0 0.5333rem;border-radius:0.5333rem;font-size:0.8667rem}
.tbl .w60{width:4rem}.tbl .w90{width:6rem}

/* ---------- Forms ---------- */
.f{display:grid;gap:0.8rem}
.f label{display:grid;gap:0.3333rem;font-size:0.8333rem;font-weight:600;color:var(--muted);min-width:0}
.f label>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select,textarea{width:100%;height:2.9333rem;background:var(--panel2);border:1px solid var(--line2);border-radius:0.7333rem;padding:0 0.8rem;color:var(--text);font-size:1rem}
textarea{height:auto;min-height:6rem;padding:0.6667rem 0.8rem;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 0.2rem var(--amber-soft)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 1.2rem) 50%,calc(100% - 0.8667rem) 50%;background-size:0.3333rem 0.3333rem;background-repeat:no-repeat;padding-right:2.1333rem}
input[type=checkbox],input[type=radio]{width:1.3333rem;height:1.3333rem;accent-color:var(--amber)}
.chk{display:flex;align-items:center;gap:0.6667rem;height:2.9333rem;font-weight:500;color:var(--text)}

<body>
<div id="root"><div class="loading">กำลังเตรียมข้อมูลทดลอง…</div></div>
<div class="toast-wrap" id="toasts"></div>
<div class="demo-tag">โหมดทดลองใช้ · ข้อมูลจำลองอยู่ในเบราว์เซอร์</div>
<script>
/* ============================================================
   AC711 — core: API / state / router / UI kit / realtime / scanner / charts
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const money = (n, d = 0) => '฿' + (+n || 0).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: 2 });
const num = n => (+n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });
const pct = (a, b) => b ? Math.round((a - b) / b * 100) : 0;
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const beDate = d => `${d.getDate()} ${TH_M[d.getMonth()]} ${d.getFullYear() + 543}`;   // วันที่แบบ พ.ศ. เช่น 5 ก.ย. 2569
const dt = s => { if (!s) return '-'; const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? s : beDate(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const dd = s => { if (!s) return '-'; const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? s : beDate(d); };
const ymLabel = ym => { if (!ym) return '-'; const [y, m] = String(ym).split('-'); return (TH_M[+m - 1] || '') + ' ' + (+y + 543); };   // งวดเดือนแบบ พ.ศ. เช่น ก.ย. 2569
const beYear = y => (+String(y).slice(0, 4) + 543);
const today = () => new Date().toISOString().slice(0, 10);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- API ---------- */
const API = {
  token: localStorage.getItem('ac711_token') || '',
  async req(path, opt = {}) {
    const headers = { ...(opt.headers || {}) };
    if (!(opt.body instanceof FormData)) headers['Content-Type'] = 'application/json';
    if (this.token) headers.Authorization = 'Bearer ' + this.token;
    const r = await fetch('/api/ac711' + path, { ...opt, headers, body: opt.body instanceof FormData ? opt.body : (opt.body ? JSON.stringify(opt.body) : undefined) });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401 && !path.startsWith('/auth/login')) { App.logout(true); throw Object.assign(new Error(d.error || 'กรุณาเข้าสู่ระบบใหม่'), { status: 401, data: d }); }
    if (r.status === 402 && !path.startsWith('/auth/login')) App.lockOut(d);
    if (!r.ok) throw Object.assign(new Error(d.error || 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง'), { status: r.status, data: d });
    return d;
  },
  get: p => API.req(p), post: (p, body) => API.req(p, { method: 'POST', body }), put: (p, body) => API.req(p, { method: 'PUT', body }), del: p => API.req(p, { method: 'DELETE' }),
  async upload(file) { const fd = new FormData(); fd.append('image', file); return API.req('/upload', { method: 'POST', body: fd }); }

/* ---------- Barcode scanner: กล้อง (BarcodeDetector) + เครื่องยิงแบบคีย์บอร์ด ---------- */
const Scanner = {
  open(onCode) {
    const m = UI.modal({ title: 'สแกนบาร์โค้ด', size: 'sm', foot: null, body: `<div class="scanbox"><video id="sv" playsinline muted autoplay></video><div class="frame"></div><div class="line"></div></div><p class="small muted mt">ส่องกล้องไปที่บาร์โค้ด หรือใช้เครื่องยิงบาร์โค้ดแล้วพิมพ์ในช่องด้านล่าง</p><input id="sc" class="mt" placeholder="พิมพ์/ยิงบาร์โค้ดที่นี่ แล้วกด Enter" autofocus><p id="sm" class="tiny muted mt"></p>`, onClose: () => stop() });
    let stream, timer; const video = $('#sv', m.el), msg = $('#sm', m.el), inp = $('#sc', m.el);
    const stop = () => { clearInterval(timer); if (stream) stream.getTracks().forEach(t => t.stop()); };
    inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim()) { const c = inp.value.trim(); stop(); m.close(); onCode(c); } };
    (async () => {
      if (!('BarcodeDetector' in window)) { msg.textContent = 'เบราว์เซอร์นี้ไม่รองรับสแกนด้วยกล้อง (ใช้ Chrome/Edge บน Android หรือเครื่องยิงบาร์โค้ด)'; return; }
      try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); video.srcObject = stream; const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'qr_code', 'upc_a'] });
        timer = setInterval(async () => { try { const codes = await det.detect(video); if (codes.length) { const c = codes[0].rawValue; stop(); m.close(); if (navigator.vibrate) navigator.vibrate(80); onCode(c); } } catch {} }, 250);
      } catch (e) { msg.textContent = 'เปิดกล้องไม่ได้: ' + e.message; }
    })();
  },
  /* ฟังเครื่องยิงบาร์โค้ด (พิมพ์เร็ว + Enter) ทั่วทั้งหน้า */
  listen(onCode) { let buf = '', last = 0; const h = e => { if (e.target.matches('input,textarea,select') && !e.target.dataset.wedge) return; const now = Date.now(); if (now - last > 120) buf = ''; last = now; if (e.key === 'Enter') { if (buf.length >= 4) onCode(buf); buf = ''; } else if (e.key.length === 1) buf += e.key; }; document.addEventListener('keydown', h); return () => document.removeEventListener('keydown', h); },
};

/* ---------- Code128 (B) → SVG สำหรับพิมพ์ป้าย ---------- */
const Code128 = (() => {
  const P = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
  return { svg(text, h = 50) { text = String(text); let sum = 104; const codes = [104]; for (let i = 0; i < text.length; i++) { const v = text.charCodeAt(i) - 32; codes.push(v); sum += v * (i + 1); } codes.push(sum % 103, 106); let x = 0; let bars = ''; codes.forEach(c => { const p = P[c]; for (let i = 0; i < p.length; i++) { const w = +p[i]; if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="${h}"/>`; x += w; } }); return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x + 20} ${h + 16}" width="100%" style="max-width:${(x + 20) * 1.6}px"><g transform="translate(10,0)" fill="#000">${bars}</g><text x="${(x + 20) / 2}" y="${h + 13}" text-anchor="middle" font-family="monospace" font-size="11" fill="#000">${esc(text)}</text></svg>`; } };
})();

/* ---------- PromptPay ---------- */
function promptpayPayload(id, amount) { id = String(id).replace(/[^0-9]/g, ''); const target = id.length >= 15 ? ['03', id] : id.length === 13 ? ['02', id] : ['01', '0066' + id.replace(/^0/, '')]; const f = (t, v) => t + String(v.length).padStart(2, '0') + v; let p = f('00', '01') + f('01', '12') + f('29', f('00', 'A000000677010111') + f(target[0], target[1])) + f('53', '764'); if (amount > 0) p += f('54', (+amount).toFixed(2)); p += f('58', 'TH') + '6304'; let crc = 0xFFFF; for (let i = 0; i < p.length; i++) { crc ^= p.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) crc = crc & 0x8000 ? (crc << 1) ^ 0x1021 : crc << 1; crc &= 0xFFFF; } return p + crc.toString(16).toUpperCase().padStart(4, '0'); }

      <h4>3. วัตถุประสงค์และฐานทางกฎหมาย</h4><ul><li><b>สร้างบัญชีและให้บริการทดลองใช้/บริการรายปี</b> รวมถึงส่งรหัสผ่าน ลิงก์ยืนยันอีเมล และการแจ้งเตือนเกี่ยวกับบัญชี — ฐานการปฏิบัติตามสัญญา (มาตรา 24(3))</li><li><b>ออกใบแจ้งหนี้ ใบเสร็จ ใบกำกับภาษี และเก็บเอกสารทางบัญชี</b> — ฐานการปฏิบัติตามกฎหมาย (มาตรา 24(6))</li><li><b>รักษาความปลอดภัยของระบบ ป้องกันการทุจริต และปรับปรุงบริการ</b> — ฐานประโยชน์โดยชอบด้วยกฎหมาย (มาตรา 24(5))</li><li><b>ส่งข่าวสาร โปรโมชัน และคำแนะนำการใช้งาน</b> — ฐานความยินยอม (มาตรา 19) ท่านเลือกให้หรือไม่ให้ก็ได้ และถอนความยินยอมได้ทุกเมื่อโดยไม่กระทบการใช้บริการ</li></ul>
      <h4>4. การเปิดเผยข้อมูล</h4><p>เราอาจเปิดเผยข้อมูลให้ผู้ประมวลผลข้อมูลที่ทำงานแทนเราภายใต้สัญญาคุ้มครองข้อมูล ได้แก่ ผู้ให้บริการคลาวด์และโฮสติ้ง ผู้ให้บริการส่งอีเมล ผู้ให้บริการรับชำระเงิน และที่ปรึกษาบัญชี/กฎหมาย รวมถึงหน่วยงานของรัฐเมื่อกฎหมายกำหนด เราไม่ขายข้อมูลส่วนบุคคลของท่านให้บุคคลภายนอก หากมีการส่งหรือโอนข้อมูลไปต่างประเทศ (เช่น เซิร์ฟเวอร์คลาวด์) เราจะดำเนินการให้ประเทศปลายทางมีมาตรฐานคุ้มครองที่เพียงพอหรือมีมาตรการคุ้มครองที่เหมาะสมตามมาตรา 28-29</p>
      <h4>5. ระยะเวลาเก็บรักษา</h4><p>เก็บข้อมูลบัญชีตลอดระยะเวลาที่ท่านใช้บริการ และเก็บต่อไม่เกิน 2 ปีนับจากวันสิ้นสุดบริการเพื่อการติดตามและข้อพิพาท เว้นแต่เอกสารทางบัญชีและภาษีซึ่งเก็บตามที่กฎหมายกำหนด (ไม่น้อยกว่า 5 ปี) บัญชีทดลองใช้ที่ไม่ยืนยันอีเมลภายใน 30 วันจะถูกลบโดยอัตโนมัติ</p>
      <h4>6. สิทธิของเจ้าของข้อมูล</h4><p>ท่านมีสิทธิขอเข้าถึงและขอรับสำเนา ขอให้โอนย้าย คัดค้าน ขอให้ลบหรือทำลาย ขอให้ระงับการใช้ ขอให้แก้ไขให้ถูกต้อง และถอนความยินยอม (มาตรา 30-36 และมาตรา 19) โดยแจ้งมาที่ DPO ตามข้อ 1 เราจะดำเนินการภายใน 30 วัน และท่านมีสิทธิร้องเรียนต่อสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคล (สคส.) หากเห็นว่าเราไม่ปฏิบัติตามกฎหมาย</p>
      <h4>7. ความปลอดภัย</h4><p>รหัสผ่านถูกเก็บในรูปแบบแฮช การรับส่งข้อมูลเข้ารหัสด้วย HTTPS มีการจำกัดสิทธิ์การเข้าถึงตามบทบาท และสำรองข้อมูลอย่างสม่ำเสมอ หากเกิดเหตุละเมิดที่มีความเสี่ยงสูง เราจะแจ้ง สคส. ภายใน 72 ชั่วโมงและแจ้งท่านโดยไม่ชักช้าตามมาตรา 37(4)</p>
      <h4>8. ข้อมูลของลูกค้าและพนักงานของท่านที่บันทึกในระบบ</h4><p>สำหรับข้อมูลลูกค้า พนักงาน และคู่ค้าที่ท่านบันทึกไว้ในระบบ AC711 ท่านเป็นผู้ควบคุมข้อมูล และ AC711 เป็นผู้ประมวลผลข้อมูลตามคำสั่งของท่านภายใต้ข้อตกลงการประมวลผลข้อมูล (DPA) ซึ่งเป็นส่วนหนึ่งของข้อกำหนดการใช้บริการ</p></div>`;
  },
  termsHtml() {
    return `<div class="pdpa"><h4>ข้อกำหนดการใช้บริการ AC711 (สรุปสาระสำคัญ)</h4><ul><li>ทดลองใช้ฟรี ${PLAN.trial_days} วันนับจากวันยืนยันอีเมล ใช้ได้ครบทุกฟีเจอร์ ไม่ผูกมัดและไม่ต้องให้ข้อมูลบัตรเครดิต</li><li>ค่าบริการรายปี ${Site.money(PLAN.price)} ไม่รวมภาษีมูลค่าเพิ่ม ${PLAN.vat}% (รวม VAT ${Site.money(Site.priceVat())}) ชำระล่วงหน้าเป็นรายปี ครอบคลุมทุกสาขาและผู้ใช้ในกิจการเดียวกัน</li><li>เมื่อครบกำหนดทดลองใช้และไม่ชำระค่าบริการ ระบบจะระงับการเข้าใช้และเก็บข้อมูลไว้ให้ 60 วันเพื่อดาวน์โหลดหรือชำระเงินก่อนลบ</li><li>ผู้ใช้ต้องรักษารหัสผ่านและรับผิดชอบการใช้งานภายใต้บัญชีของตน ห้ามใช้ระบบเพื่อการที่ผิดกฎหมาย</li><li>ข้อมูลในระบบเป็นของท่าน ท่านส่งออกข้อมูลได้ทุกเมื่อ ผู้ให้บริการทำหน้าที่ผู้ประมวลผลข้อมูลตาม DPA</li><li>ผู้ให้บริการรับประกันความพร้อมใช้งานของระบบไม่น้อยกว่า 99.5% ต่อเดือน ไม่นับการปิดปรับปรุงที่แจ้งล่วงหน้า</li></ul></div>`;
  },
  pdpaModal({ onAccept = null, readOnly = false } = {}) {
    const m = UI.modal({ title: readOnly ? 'นโยบายความเป็นส่วนตัว' : 'ประกาศความเป็นส่วนตัวและข้อกำหนดการใช้บริการ', size: 'lg', foot: readOnly ? `<button class="btn amber block" id="pk">ปิด</button>` : `<div class="pdpa-foot"><button class="btn ghost" id="pno">ไม่ยอมรับ</button><button class="btn amber" id="pyes" disabled>ยอมรับและสร้างบัญชีทดลองใช้</button></div>`,
      body: `<div class="pdpa-box">${Site.privacyHtml()}${readOnly ? '' : Site.termsHtml()}</div>${readOnly ? '' : `<div class="f mt2"><label class="chk"><input type="checkbox" id="c_req"> <span>ข้าพเจ้าได้อ่านและรับทราบประกาศความเป็นส่วนตัว และยอมรับข้อกำหนดการใช้บริการ (จำเป็น)</span></label><label class="chk"><input type="checkbox" id="c_mkt"> <span>ยินยอมให้ AC711 ส่งข่าวสาร โปรโมชัน และคำแนะนำการใช้งานทางอีเมล/โทรศัพท์ (ไม่บังคับ ถอนได้ทุกเมื่อในเมนูตั้งค่า)</span></label></div>`}` });
    if (readOnly) { $('#pk', m.el).onclick = m.close; return m; }
    const req = $('#c_req', m.el), yes = $('#pyes', m.el);
    req.onchange = () => { yes.disabled = !req.checked; };
    $('#pno', m.el).onclick = () => { m.close(); UI.toast('ไม่สามารถสร้างบัญชีได้หากไม่ยอมรับเงื่อนไข ข้อมูลที่กรอกยังไม่ถูกบันทึก', 'err'); };
    yes.onclick = () => { if (!req.checked) return; const consent = { privacy_version: PLAN.privacy_version, accepted_at: new Date().toISOString(), terms: true, marketing: $('#c_mkt', m.el).checked }; m.close(); onAccept && onAccept(consent); };
    return m;
  },
  termsModal() { const m = UI.modal({ title: 'ข้อกำหนดการใช้บริการ', size: 'lg', body: `<div class="pdpa-box">${Site.termsHtml()}</div>`, foot: `<button class="btn amber block" id="tk">ปิด</button>` }); $('#tk', m.el).onclick = m.close; },
  /* ---------- กล่องจดหมายจำลอง (ในระบบจริงจะส่งอีเมลผ่านผู้ให้บริการอีเมล) ---------- */
  mail(q = {}) {
    const acc = Site.find(q.to); const type = q.type || 'verify';
    if (!acc) { UI.err('ไม่พบบัญชีนี้'); return Site.go('signup'); }
    const isVerify = type === 'verify';
    const link = isVerify ? `#/verify?t=${acc.verify_token}` : `#/reset?t=${acc.reset_token}`;
    $('#root').innerHTML = `<div class="auth"><div class="authbox wide mailwrap">${Site.brand('ระบบบริหารร้านอะไหล่และสาขา')}<h1>${isVerify ? 'ส่งอีเมลยืนยันแล้ว' : 'ส่งอีเมลรีเซ็ตรหัสผ่านแล้ว'}</h1><div class="sub">เราส่งอีเมลไปที่ <b>${esc(acc.email)}</b> กรุณาเปิดอีเมลแล้วกดปุ่มยืนยัน หากไม่พบให้ตรวจสอบในกล่องจดหมายขยะ</div>
      <div class="mailcard"><div class="mh2"><span>${Site.icon('mail')}</span><div><div><b>จาก:</b> AC711 &lt;no-reply@ac711.com&gt;</div><div><b>ถึง:</b> ${esc(acc.email)}</div><div><b>เรื่อง:</b> ${isVerify ? 'ยืนยันอีเมลและรหัสผ่านทดลองใช้ AC711' : 'ตั้งรหัสผ่านใหม่สำหรับ AC711'}</div></div></div>
        <div class="mbody">สวัสดีคุณ${esc(acc.name)}<br><br>${isVerify ? `ขอบคุณที่สมัครทดลองใช้ AC711 สำหรับ <b>${esc(acc.company)}</b> นี่คือข้อมูลเข้าใช้งานของคุณ<br><br><div class="cred"><div><small>ชื่อผู้ใช้</small><b>${esc(acc.email)}</b></div><div><small>รหัสผ่านชั่วคราว</small><span class="codebox">${esc(acc.password)}</span></div></div><br>กดปุ่มด้านล่างเพื่อยืนยันอีเมล ระยะทดลองใช้ฟรี ${PLAN.trial_days} วันจะเริ่มนับทันทีที่ยืนยัน แนะนำให้เปลี่ยนรหัสผ่านหลังเข้าสู่ระบบครั้งแรก` : `มีคำขอตั้งรหัสผ่านใหม่สำหรับบัญชี <b>${esc(acc.email)}</b> หากท่านไม่ได้ขอ กรุณาเพิกเฉยต่ออีเมลนี้ ลิงก์มีอายุ 60 นาที`}<br><br><a class="btn amber lg" href="${link}">${isVerify ? 'ยืนยันอีเมลและเริ่มใช้งาน' : 'ตั้งรหัสผ่านใหม่'}</a><br><br><span class="muted small">อีเมลนี้ส่งจากระบบอัตโนมัติ ${PLAN.site}</span></div></div>
      <div class="demo-note">โหมดสาธิต: กล่องจดหมายนี้จำลองอีเมลที่ระบบจริงจะส่งไปยังผู้สมัคร</div>
      <div class="authlinks"><a href="#/login">ไปหน้าเข้าสู่ระบบ</a><a href="#/">กลับหน้าแรก</a></div></div></div>`;
  },
  verify(q = {}) {
    const acc = Site.byToken('verify_token', q.t);
    if (!acc) { UI.err('ลิงก์ยืนยันไม่ถูกต้องหรือถูกใช้ไปแล้ว'); return Site.go('login'); }
    const start = new Date(); const end = new Date(start.getTime() + PLAN.trial_days * 864e5);
    const z = n => String(n).padStart(2, '0'); const ymdL = d => `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
    Site.update(acc.email, { verified: true, verify_token: null, trial_start: ymdL(start), trial_end: ymdL(end), plan: 'trial', locked: false }); Site.log('verify', acc.company, { tenant: acc.company, email: acc.email, user: acc.name });
    const demo = window.AC711_DEMO; if (demo?.ins) Site.seedAccounts(demo.ins, demo.DB, acc.email);
    Site.go('login', 'u=' + encodeURIComponent(acc.email) + '&verified=1');
  },
  forgot() {
    $('#root').innerHTML = `<div class="auth"><form class="authbox" id="ff">${Site.brand('ระบบบริหารร้านอะไหล่และสาขา')}<h1>ลืมรหัสผ่าน</h1><div class="sub">กรอกอีเมลที่ใช้สมัคร ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้</div>
      <div class="f"><label><span>อีเมล</span><input id="e" type="email" required autofocus autocomplete="email"></label><button class="btn amber lg block" type="submit">ส่งลิงก์รีเซ็ตรหัสผ่าน</button></div>
      <div class="authlinks"><a href="#/login">กลับไปเข้าสู่ระบบ</a><a href="#/signup">ทดลองใช้ฟรี 30 วัน</a></div></form></div>`;
    $('#ff').onsubmit = e => {
      e.preventDefault(); const email = Site.norm($('#e').value); const acc = Site.find(email);
      if (!acc) return UI.ok('หากอีเมลนี้มีบัญชีอยู่ในระบบ เราได้ส่งลิงก์ตั้งรหัสผ่านใหม่ให้แล้ว');
      Site.update(email, { reset_token: Site.token(), reset_at: Date.now() }); Site.go('mail', 'type=reset&to=' + encodeURIComponent(email));
    };
  },
  reset(q = {}) {
    const acc = Site.byToken('reset_token', q.t);
    if (!acc || Date.now() - (acc.reset_at || 0) > 60 * 60e3) { UI.err('ลิงก์ตั้งรหัสผ่านใหม่ไม่ถูกต้องหรือหมดอายุ'); return Site.go('forgot'); }
    $('#root').innerHTML = `<div class="auth"><form class="authbox" id="rf">${Site.brand('ระบบบริหารร้านอะไหล่และสาขา')}<h1>ตั้งรหัสผ่านใหม่</h1><div class="sub">สำหรับบัญชี <b>${esc(acc.email)}</b></div>
      <div class="f"><label><span>รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</span><input id="p1" type="password" minlength="8" required autofocus autocomplete="new-password"></label><label><span>ยืนยันรหัสผ่านใหม่</span><input id="p2" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn amber lg block" type="submit">บันทึกรหัสผ่านใหม่</button></div></form></div>`;
    $('#rf').onsubmit = e => {
      e.preventDefault(); const p1 = $('#p1').value, p2 = $('#p2').value;
      if (p1.length < 8) return UI.err('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร'); if (p1 !== p2) return UI.err('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
      Site.update(acc.email, { password: p1, reset_token: null, reset_at: null });
      const demo = window.AC711_DEMO; if (demo?.DB) { const s = demo.DB.staff.find(x => x.username === acc.email); if (s) s.password = p1; }
      Site.go('login', 'u=' + encodeURIComponent(acc.email) + '&reset=1');
    };
  },
  /* ---------- สถานะทดลองใช้ / แพ็กเกจรายปี (แสดงเมื่อเข้าสู่ระบบแล้ว) ---------- */
  bindTrialChip() { const c = $('#trialchip'); if (c) c.onclick = () => Site.pricingModal(Site.planOf()); }

};

  /* บัญชีหมดอายุ/ถูกระงับระหว่างใช้งาน (เซิร์ฟเวอร์ตอบ 402): ออกจากระบบและเปิดหน้าแพ็กเกจให้แจ้งชำระเงิน */
  lockOut(d = {}) { API.token = ''; localStorage.removeItem('ac711_token'); App.user = null; if (App.es) App.es.close(); App.renderLogin(); UI.err(d.error || 'บัญชีนี้ถูกระงับการใช้งาน'); if (d.plan) Site.pricingModal(d.plan, d.billing_token || null); },

  async route() {
    const [, page = 'dash', qs = ''] = location.hash.match(/^#\/?([a-z-]*)\??(.*)$/) || []; const params = Object.fromEntries(new URLSearchParams(qs));

    App.sse.filter(([x]) => x === '__leave').forEach(([, fn]) => { try { fn(); } catch {} }); const main = $('#main'); main.innerHTML = UI.loading(); App.sse = []; window.scrollTo(0, 0);

  on(ev, fn) { App.sse.push([ev, fn]); },   // หน้าปัจจุบันสมัครรับ event realtime

    if (App.es) App.es.close();

  },

    $('#pin', m.el).onclick = async () => { m.close(); const u = await UI.prompt('สลับผู้ใช้', 'ชื่อผู้ใช้'); if (!u) return; const p = await UI.prompt('สลับผู้ใช้', 'PIN', '', { type: 'password' }); if (!p) return; try { const r = await API.post('/auth/pin', { username: u, pin: p }); API.token = r.token; localStorage.setItem('ac711_token', r.token); App.user = r.user; UI.ok('สลับเป็น ' + r.user.name); App.boot(); } catch (e) { UI.err(e.message); } };
  },
};

  const PRESETS = [['today', 'วันนี้'], ['week', 'สัปดาห์นี้'], ['month', 'เดือนนี้'], ['lastMonth', 'เดือนที่แล้ว'], ['year', 'ปีนี้'], ['lastYear', 'ปีที่แล้ว'], ['custom', 'กำหนดเอง']];

async function expenseForm(refresh) { const sups = await API.get('/suppliers'); const m = UI.modal({ title: 'บันทึกค่าใช้จ่าย', size: 'sm', foot: `<button class="btn ghost" id="cancel">ยกเลิก</button><button class="btn amber" id="save">ส่งขออนุมัติ</button>`, body: `<div class="f"><label><span>หมวด</span><select id="c"><option value="utility">ค่าน้ำ/ไฟ/อินเทอร์เน็ต</option><option value="rent">ค่าเช่า</option><option value="transport">ค่าขนส่ง</option><option value="marketing">การตลาด/โฆษณา</option><option value="repair">ซ่อมบำรุง</option><option value="supplies">วัสดุสิ้นเปลือง</option><option value="salary">เงินเดือน/ค่าจ้าง</option><option value="fee">ค่าธรรมเนียม</option><option value="other">อื่น ๆ</option></select></label><div class="grid g2"><label><span>ยอดรวม (รวม VAT ถ้ามี)</span><input id="a" type="number" step="0.01"></label><label><span>VAT ในยอด (0 ถ้าไม่มีใบกำกับ)</span><input id="v" type="number" step="0.01" value="0"></label></div><label><span>วิธีจ่าย</span><select id="pm"><option value="cash">เงินสด (จ่ายแล้ว)</option><option value="transfer">โอน (จ่ายแล้ว)</option><option value="credit">เครดิต — ตั้งเจ้าหนี้ รอจ่ายทีหลัง</option></select></label><label><span>ผู้รับเงิน / เจ้าหนี้</span><select id="sp"><option value="">ไม่ระบุ</option>${sups.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><div class="grid g2"><label><span>หัก ณ ที่จ่าย %</span><select id="w"><option value="0">ไม่หัก</option><option value="1">1% ขนส่ง</option><option value="2">2% โฆษณา</option><option value="3">3% บริการ</option><option value="5">5% ค่าเช่า</option></select></label><label><span>เลขใบกำกับ/ใบเสร็จ</span><input id="si"></label></div><label><span>รายละเอียด</span><input id="n"></label><label><span>รูปใบเสร็จ</span><input type="file" id="f" accept="image/*"></label><p class="tiny muted">ค่าเช่า/บริการ/ขนส่งจ่ายให้นิติบุคคล ต้องหัก ณ ที่จ่ายและออกหนังสือรับรอง 50 ทวิ · ระบบลงบัญชีให้อัตโนมัติเมื่ออนุมัติ</p></div>` }); $('#c', m.el).onchange = e => { const w = { rent: '5', transport: '1', marketing: '2', repair: '3' }[e.target.value]; if (w) $('#w', m.el).value = w; }; $('#cancel', m.el).onclick = m.close; $('#save', m.el).onclick = async () => { try { let img = ''; if ($('#f', m.el).files[0]) img = (await API.upload($('#f', m.el).files[0])).url; const r = await API.post('/expenses', { branch_id: curBranch(), category: $('#c', m.el).value, amount: +$('#a', m.el).value, vat: +$('#v', m.el).value, pay_method: $('#pm', m.el).value, supplier_id: +$('#sp', m.el).value || null, wht_rate: +$('#w', m.el).value, supplier_invoice: $('#si', m.el).value, note: $('#n', m.el).value, receipt_img: img }); m.close(); UI.ok(`บันทึก ${r.code} รออนุมัติ`); refresh(); } catch (e) { UI.err(e.message); } }; }

Pages.transfers = async (main) => {
  const can = ['owner', 'hq_manager', 'stock', 'branch_manager'].includes(App.user.role);
  main.innerHTML = head('โอนย้ายระหว่างสาขา', 'สร้าง → อนุมัติต้นทาง → ส่งของ (ตัดสต็อก) → รับของปลายทาง (เพิ่มสต็อกด้วยต้นทุนล็อตเดิม)', can ? '<button class="btn amber" id="new">➕ สร้างใบโอน</button>' : '') + '<div id="rng" class="mb"></div><div id="out"></div>';
  const rng = UI.range({ key: 'docs' }, () => load()); $('#rng').appendChild(rng);
  const out = $('#out'); const load = async () => { const rows = await API.get(`/transfers?${App.bq()}&${rng.qs()}`); out.innerHTML = rows.length ? `<div class="card pad0 tbl-wrap"><table class="tbl"><thead><tr><th>เลขที่</th><th>จาก</th><th>ไป</th><th class="num">รายการ</th><th class="num">มูลค่าทุน</th><th>สถานะ</th><th>ผู้ขอ</th><th>วันที่</th><th></th></tr></thead><tbody>${rows.map(t => `<tr class="click" data-id="${t.id}"><td class="b">${esc(t.code)}</td><td>${esc(t.from_name)}</td><td>${esc(t.to_name)}</td><td class="num">${t.n}</td><td class="num">${money(t.total)}</td><td>${UI.pill(t.status)}</td><td>${esc(t.staff_name || '')}</td><td>${dd(t.created_at)}</td><td>${histBtn('transfers', t.id, t.code, 'transfer', 'btn sm ghost')} ${t.status === 'approved' && (App.user.all_branches || t.from_branch === App.user.branch_id) ? `<button class="btn sm amber" data-ship="${t.id}">🚚 ส่งของ</button>` : t.status === 'shipped' && (App.user.all_branches || t.to_branch === App.user.branch_id) ? `<button class="btn sm green" data-recv="${t.id}">📥 รับของ</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : UI.empty('ยังไม่มีใบโอน');
    out.onclick = async e => { const b = e.target.closest('button'); if (b?.dataset.ship) { if (await UI.confirm('ส่งของ', 'ตัดสต็อกต้นทางตาม FIFO/FEFO และส่งของไปสาขาปลายทาง?', { danger: false })) { try { await API.post(`/transfers/${b.dataset.ship}/ship`); UI.ok('ส่งของแล้ว'); load(); } catch (err) { UI.err(err.message); } } return; } if (b?.dataset.recv) { try { await API.post(`/transfers/${b.dataset.recv}/receive`); UI.ok('รับของเข้าสต็อกแล้ว'); load(); } catch (err) { UI.err(err.message); } return; } const tr = e.target.closest('tr[data-id]'); if (tr) { const t = await API.get('/transfers/' + tr.dataset.id); UI.modal({ title: 'ใบโอน ' + t.code, size: 'lg', foot: null, body: `<div class="flex mb">${UI.pill(t.status)}<span class="muted small">${esc(t.from_name)} → ${esc(t.to_name)} · ${esc(t.staff_name || '')} · ${dt(t.created_at)}</span></div>${stepsHtml(t.approvals)}<div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>SKU</th><th>สินค้า</th><th class="num">จำนวน</th><th class="num">รับแล้ว</th></tr></thead><tbody>${t.items.map(i => `<tr><td>${esc(i.sku)}</td><td>${esc(i.pname)}</td><td class="num">${num(i.qty)}</td><td class="num">${num(i.received_qty)}</td></tr>`).join('')}</tbody></table></div>` }); } }; };
  if (can) $('#new').onclick = () => { const items = []; const from = curBranch(); const m = UI.modal({ title: '🔁 ใบโอนย้ายใหม่', size: 'lg', foot: `<button class="btn ghost" id="cancel">ยกเลิก</button><button class="btn amber" id="save">ส่งขออนุมัติ</button>`, body: `<div class="grid g2 mb"><label><span class="small muted">จากสาขา</span>${branchSel('from', from)}</label><label><span class="small muted">ไปสาขา</span><select id="to">${App.branches.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label></div><div class="toolbar"><button class="btn" id="pick">➕ เพิ่มสินค้า</button><button class="btn" id="scan">📷</button><input id="note" placeholder="หมายเหตุ" style="flex:1;min-width:10.6667rem"></div><div class="tbl-wrap card pad0"><table class="tbl"><thead><tr><th>สินค้า</th><th class="num">คงเหลือต้นทาง</th><th class="w90">จำนวน</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>` }); const tb = $('#tb', m.el); const render = () => tb.innerHTML = items.length ? items.map((it, i) => `<tr><td><div class="ell" style="max-width:17.3333rem">${esc(it.name)}</div><div class="tiny dim">${esc(it.sku)}</div></td><td class="num">${num(it.avail)}</td><td><input type="number" class="q" data-i="${i}" value="${it.qty}"></td><td><button class="btn sm ghost red" data-rm="${i}">✕</button></td></tr>`).join('') : '<tr><td colspan="4" class="muted center">ยังไม่มีรายการ</td></tr>'; render(); const add = async p => { const full = await API.get('/products/' + p.id); const avail = full.stock.find(s => s.branch_id === +$('#from', m.el).value)?.qty || 0; items.push({ product_id: p.id, sku: p.sku, name: p.name, qty: 1, avail }); render(); }; $('#pick', m.el).onclick = async () => { const p = await UI.pickProduct(); if (p) add(p); }; $('#scan', m.el).onclick = () => Scanner.open(async c => { try { add(await API.get('/products/lookup/' + encodeURIComponent(c))); } catch (e) { UI.err(e.message); } }); tb.onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { items.splice(+b.dataset.rm, 1); render(); } }; tb.onchange = e => { const it = items[+e.target.dataset.i]; if (it) it.qty = +e.target.value; }; $('#cancel', m.el).onclick = m.close; $('#save', m.el).onclick = async () => { try { const r = await API.post('/transfers', { from_branch: +$('#from', m.el).value, to_branch: +$('#to', m.el).value, note: $('#note', m.el).value, items: items.map(it => ({ product_id: it.product_id, qty: it.qty })) }); m.close(); UI.ok(`สร้าง ${r.code} รออนุมัติ`); load(); } catch (e) { UI.err(e.message); } }; };
  App.on('approval', load); load();
};

<script>
/* ============================================================
   AC711 pages (flow): เอกสาร&อนุมัติ / ออเดอร์ออนไลน์ / แชท / พยากรณ์
   ============================================================ */
const CH = { pos: 'หน้าร้าน', shopee: 'Shopee', lazada: 'Lazada', tiktok: 'TikTok Shop', thaimart: 'ThaiMart', amaze: 'Amaze', line: 'LINE', facebook: 'Facebook', web: 'เว็บ' };
const CHI = { shopee: '🟠', lazada: '🔵', tiktok: '⚫', thaimart: '🟢', amaze: '🟣', line: '💚', facebook: '💙', pos: '🏪', web: '🌐' };

/* ===================== เอกสาร & อนุมัติ ===================== */
Pages.approvals = async (main, params) => {
  let tab = App.firstTab('approvals', params.tab || 'inbox'); const isMgr = ['owner', 'hq_manager', 'branch_manager', 'accountant', 'purchasing'].includes(App.user.role);
  main.innerHTML = head('เอกสาร & อนุมัติ', 'ผู้ขอ ≠ ผู้อนุมัติ เสมอ · ลำดับขั้นตามมูลค่า · บันทึกตรวจสอบแบบโซ่แฮช · กดเอกสารเพื่อดูรายละเอียด / ปุ่มประวัติเพื่อตรวจสอบย้อนกลับ') + '<div id="seg" class="mb"></div><div id="rng" class="mb" hidden></div><div id="out"></div>';
  const tabs = [{ v: 'inbox', l: '📥 รอฉันอนุมัติ' }, { v: 'mine', l: '📤 ที่ฉันขอ' }]; if (isMgr) tabs.push({ v: 'all', l: '📚 ทั้งหมด' }, { v: 'audit', l: '🔍 บันทึกตรวจสอบ' }, { v: 'rules', l: '📐 กฎอนุมัติ' }); tabs.splice(0, tabs.length, ...App.tabs('approvals', tabs)); if (!tabs.some(t => t.v === tab)) tab = tabs[0]?.v || tab;
  $('#seg').appendChild(UI.seg(tabs, tab, v => { tab = v; $('#rng').hidden = !['all', 'audit'].includes(tab); load(); })); const out = $('#out'); const rng = UI.range({ key: 'docs' }, () => load()); $('#rng').appendChild(rng); $('#rng').hidden = !['all', 'audit'].includes(tab);
  const load = async () => { out.innerHTML = UI.loading();
    if (tab === 'inbox') { const rows = await API.get('/approvals/inbox'); out.innerHTML = rows.length ? `<div class="grid g3 acards">${rows.map(a => `<div class="card acard"><div class="flex between"><b class="ell">${esc(a.doc_label)} ${esc(a.doc_code)}</b><span class="pill amber">ขั้น ${a.step_no}/${a.total_steps}</span></div><div class="v amber b" style="font-size:1.6rem;margin:0.4rem 0">${money(a.amount)}</div><div class="small muted ell">สาขา ${esc(a.branch_name || '-')} · โดย ${esc(a.requester_name || '')}</div><div class="tiny dim">${dt(a.created_at)}${a.self ? ' · <span class="red">เอกสารของคุณเอง (อนุมัติไม่ได้)</span>' : ''}</div><div class="acts"><button class="btn sm" data-view="${a.doc_type}:${a.doc_id}">ดูรายละเอียด</button><button class="btn sm red" data-dec="reject:${a.id}" ${a.self ? 'disabled' : ''}>ไม่อนุมัติ</button><button class="btn sm green" data-dec="approve:${a.id}" ${a.self ? 'disabled' : ''}>✓ อนุมัติ</button></div></div>`).join('')}</div>` : UI.empty('ไม่มีเอกสารรอคุณอนุมัติ', '✅'); }
    else if (tab === 'mine') { const rows = await API.get('/approvals/mine'); out.innerHTML = rows.length ? tableAppr(rows) : UI.empty('คุณยังไม่มีคำขอ'); }

  main.innerHTML = head('แชท LINE / Facebook', `AI "${esc(App.aiPersona || 'น้อง AC711')}" ตอบอัตโนมัติ 24 ชม. · ค้นสินค้า/สต็อกจริง · เปิดออเดอร์ให้สาขาใกล้ที่สุด · พนักงานรับช่วงได้ทุกเมื่อ`, `${['owner', 'hq_manager', 'branch_manager', 'marketing'].includes(App.user.role) ? '<button class="btn" id="sim">🧪 ทดสอบ AI</button>' : ''}`) + `<div class="chatwrap"><div class="card pad0 contacts" id="cl"></div><div class="card pad0 thread" id="th"><div class="empty"><div class="ic">💬</div>เลือกการสนทนา</div></div></div>`;
  const cl = $('#cl'); const th = $('#th');
  const loadContacts = async () => { contacts = await API.get('/chat/contacts'); cl.innerHTML = contacts.length ? contacts.map(c => `<div class="row click ${c.id === cur ? 'on' : ''}" data-id="${c.id}" style="height:4.4rem;${c.id === cur ? 'background:var(--panel2)' : ''}"><div class="ic">${c.platform === 'line' ? '💚' : '💙'}</div><div class="m"><b>${esc(c.name)} ${c.ai_mode ? '<span class="ai-badge">AI</span>' : '<span class="pill">พนักงาน</span>'}</b><span>${esc(c.last_text)}</span></div><div class="e"><span>${dt(c.last_at)}</span>${c.unread ? `<b class="pill red">${c.unread}</b>` : ''}</div></div>`).join('') : UI.empty('ยังไม่มีการสนทนา — เชื่อม LINE OA / Facebook ในตั้งค่า', '💬'); };
  const openThread = async id => { cur = id; const c = contacts.find(x => x.id === id); if (!c) return; $$('.row', cl).forEach(r => r.style.background = +r.dataset.id === id ? 'var(--panel2)' : ''); const msgs = await API.get(`/chat/contacts/${id}/messages`);
    th.innerHTML = `<div class="flex between" style="padding:0.6667rem 0.9333rem;border-bottom:1px solid var(--line);flex:none"><div class="ell"><b>${esc(c.name)}</b> <span class="tiny muted">${c.platform} · สาขา ${esc(c.bcode || '-')}</span></div><div class="flex" style="flex-wrap:nowrap"><label class="chk small" style="height:auto"><input type="checkbox" id="aim" ${c.ai_mode ? 'checked' : ''}> AI ตอบอัตโนมัติ</label>${branchSel('cbr', c.assigned_branch, false).replace('<select', '<select style="height:2.2667rem;width:10rem;font-size:0.8667rem"')}</div></div><div class="msgs" id="msgs">${msgs.map(bubble).join('') || '<div class="empty">ยังไม่มีข้อความ</div>'}</div><div class="compose"><input id="ct" placeholder="พิมพ์ข้อความถึงลูกค้า… (ส่งแล้ว AI จะหยุดตอบจนกว่าจะเปิดใหม่)"><button class="btn amber" id="cs">ส่ง</button></div>`;
    const box = $('#msgs', th); box.scrollTop = box.scrollHeight;
    $('#aim', th).onchange = async e => { await API.put('/chat/contacts/' + id, { ai_mode: e.target.checked ? 1 : 0 }); UI.ok(e.target.checked ? 'AI กลับมาตอบอัตโนมัติ' : 'พนักงานรับช่วงแล้ว'); loadContacts(); }; $('#cbr', th).onchange = async e => { await API.put('/chat/contacts/' + id, { assigned_branch: +e.target.value }); UI.ok('ย้ายสาขาแล้ว'); };
    const send = async () => { const t = $('#ct', th).value.trim(); if (!t) return; $('#ct', th).value = ''; try { await API.post(`/chat/contacts/${id}/send`, { text: t }); await API.put('/chat/contacts/' + id, { ai_mode: 0 }); $('#aim', th).checked = false; box.insertAdjacentHTML('beforeend', bubble({ direction: 'out', text: t, by_ai: 0, staff_name: App.user.name, created_at: new Date().toISOString() })); box.scrollTop = box.scrollHeight; } catch (e) { UI.err(e.message); } }; $('#cs', th).onclick = send; $('#ct', th).onkeydown = e => { if (e.key === 'Enter') send(); }; };
  const bubble = m => `<div class="bubble ${m.direction === 'in' ? 'in' : m.by_ai ? 'ai' : 'out'}">${esc(m.text)}<span class="meta">${m.direction === 'in' ? 'ลูกค้า' : m.by_ai ? '🤖 AI' : esc(m.staff_name || 'พนักงาน')} · ${dt(m.created_at)}</span></div>`;
  cl.onclick = e => { const r = e.target.closest('[data-id]'); if (r) openThread(+r.dataset.id); };
  const sim = $('#sim'); if (sim) sim.onclick = () => { const m = UI.modal({ title: '🧪 ทดสอบ AI น้อง AC711 (จำลองลูกค้า LINE)', size: 'lg', foot: null, body: `<p class="small muted mb">${App.aiReady ? 'เชื่อม Claude แล้ว — AI จะค้นสินค้า/สต็อกจริง และเปิดออเดอร์ได้' : '<span class="red">ยังไม่ได้ใส่ ANTHROPIC_API_KEY</span> — ใช้โหมดตอบพื้นฐาน (ค้นสินค้าตามคำ)'}</p><div class="chips mb" id="qs">${['คอมแอร์ Vigo ราคาเท่าไหร่', 'แบต 80D26L มีไหม สาขา 0002', 'แอร์ไม่เย็น Civic FD ต้องเปลี่ยนอะไร', 'สั่งกรองแอร์ D-Max 2 อัน ส่งสาขา 0005'].map(q => `<button>${q}</button>`).join('')}</div><div class="msgs card" id="sm" style="height:20rem;overflow:auto;display:flex;flex-direction:column;gap:0.5333rem"></div><div class="compose" style="border:none;padding:0.6667rem 0 0"><input id="st" placeholder="พิมพ์เหมือนลูกค้า…"><button class="btn amber" id="ss">ส่ง</button></div>` }); const box = $('#sm', m.el); const go = async t => { if (!t) return; box.insertAdjacentHTML('beforeend', bubble({ direction: 'in', text: t, created_at: new Date().toISOString() })); box.insertAdjacentHTML('beforeend', '<div class="bubble ai" id="wait">กำลังคิด…</div>'); box.scrollTop = box.scrollHeight; try { const r = await API.post('/chat/simulate', { text: t, external_id: 'demo-' + App.user.id }); $('#wait', box).outerHTML = bubble({ direction: 'out', by_ai: 1, text: r.reply || '(AI ปิดอยู่ — พนักงานรับช่วง)', created_at: new Date().toISOString() }); } catch (e) { $('#wait', box).outerHTML = `<div class="bubble ai red">${esc(e.message)}</div>`; } box.scrollTop = box.scrollHeight; loadContacts(); }; $('#qs', m.el).onclick = e => { const b = e.target.closest('button'); if (b) go(b.textContent); }; $('#ss', m.el).onclick = () => { go($('#st', m.el).value); $('#st', m.el).value = ''; }; $('#st', m.el).onkeydown = e => { if (e.key === 'Enter') { go(e.target.value); e.target.value = ''; } }; };
  App.on('chat', async d => { await loadContacts(); if (d.contact_id === cur) openThread(cur); }); await loadContacts(); if (cur) openThread(cur);
};

/* ===================== พยากรณ์ยอดขาย ===================== */
Pages.forecast = async (main, params) => {
  main.innerHTML = head('พยากรณ์ยอดขาย', 'แยกฤดูกาล (หน้าร้อน มี.ค.–พ.ค. อะไหล่แอร์พุ่ง) + Holt trend เทียบ WMA เลือกวิธีที่แม่นกว่าจาก backtest · จุดสั่งซื้อ + สต็อกปลอดภัย', `<button class="btn" id="pick">🔍 เลือกสินค้า</button><button class="btn amber" id="plan">📝 แผนสั่งซื้อ</button>`) + `<div class="grid g-2-1 mb"><div class="card"><h3>รายได้รวม: ย้อนหลัง 18 เดือน + พยากรณ์ 3 เดือน <span class="r" id="rvs"></span></h3><div id="rv"></div></div><div class="card"><h3>ดัชนีฤดูกาล (จากข้อมูลจริง)</h3><div id="si"></div><p class="tiny muted mt">>1 = เดือนที่ขายดีกว่าค่าเฉลี่ย ระบบใช้คูณกลับหลังพยากรณ์แนวโน้ม</p></div></div><div id="pd"></div><div class="card mt"><h3>สินค้าขายดี 12 เดือน + พยากรณ์ 3 เดือนข้างหน้า <span class="r">แตะเพื่อดูรายละเอียด</span></h3><div id="top">${UI.loading()}</div></div>`;
  const rv = await API.get(`/forecast/revenue?${App.bq()}`); const rh = rv.history.slice(0, -1); const labels = [...rh.map(h => ymLabel(h.ym)), ...rv.forecast.map(f => ymLabel(f.ym))];
  Chart.lines($('#rv'), [{ name: 'ยอดจริง', color: Chart.C.a, area: true, values: [...rh.map(h => h.amount), ...rv.forecast.map(() => null)] }, { name: 'พยากรณ์', color: Chart.C.c, dashed: true, values: [...rh.slice(0, -1).map(() => null), rh[rh.length - 1].amount, ...rv.forecast.map(f => f.amount)] }, { name: 'ช่วงสูง', color: Chart.C.b, dashed: true, values: [...rh.map(() => null), ...rv.forecast.map(f => f.high)] }], { labels, fmt: money, h: 240 });
  $('#rvs').textContent = `แนวโน้ม ${rv.trend > 0 ? '↑' : '↓'} ${money(Math.abs(rv.trend))}/เดือน`;
  Chart.bars($('#si'), rv.seasonal_index.map((v, i) => ({ k: ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'][i], v, dim: v < 1 })), { fmt: v => v.toFixed(2), h: 180 });
  const showProduct = async id => { const f = await API.get(`/forecast/product/${id}?${App.bq()}`); const pd = $('#pd'); pd.innerHTML = `<div class="card mb"><h3>📦 ${esc(f.product.name)} <span class="pill amber">${esc(f.product.sku)}</span> <span class="r">${App.branch ? App.branchName(App.branch) : 'ทุกสาขา'} · วิธี ${f.method === 'holt' ? 'Holt (ระดับ+แนวโน้ม)' : 'WMA 3 เดือน'} · ความแม่น backtest ${f.accuracy}%</span></h3><div class="grid g4 mb">${kpi('คงเหลือ', num(f.on_hand), `${f.days_cover >= 999 ? '∞' : f.days_cover} วันคงคลัง`, f.days_cover <= 7 ? 'red' : '')}${kpi('เดือนนี้ (ขายแล้ว/คาด)', `${num(f.current_month.qty)} / ${num(f.forecast[0].qty)}`, 'ทั้งเดือน', '')}${kpi('พยากรณ์เดือนหน้า', num(f.forecast[1].qty), `${f.forecast[1].low}–${f.forecast[1].high}`, 'amber')}${kpi('ขาย/วัน', f.daily_avg, 'ค่าเฉลี่ยพยากรณ์')}${kpi('จุดสั่งซื้อ (ROP)', f.reorder_point, `นำส่ง ${f.lead_days} วัน`)}${kpi('สต็อกปลอดภัย', f.safety_stock, 'ระดับบริการ 95%')}${kpi('แนะนำสั่ง', f.suggest_qty, f.suggest_qty ? 'ถึงจุดสั่งซื้อแล้ว' : 'ยังไม่ต้องสั่ง', f.suggest_qty ? 'red' : 'amber')}</div><div id="pc"></div><div class="flex mt"><span class="pill">${UI.pill(f.trend)}</span><span class="tiny muted">Min ${f.min_qty ?? '-'} / Max ${f.max_qty ?? '-'} · ดัชนีฤดูกาลหมวด: ${f.product.seasonal}</span></div></div>`;
    const hist = f.history.slice(-12); Chart.lines($('#pc'), [{ name: 'ขายจริง (ชิ้น)', color: Chart.C.a, area: true, values: [...hist.map(h => h.qty), ...f.forecast.map(() => null)] }, { name: 'พยากรณ์', color: Chart.C.c, dashed: true, values: [...hist.slice(0, -1).map(() => null), hist[hist.length - 1].qty, ...f.forecast.map(x => x.qty)] }], { labels: [...hist.map(h => ymLabel(h.ym)), ...f.forecast.map(x => ymLabel(x.ym))], h: 200 }); pd.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  const top = await API.get(`/forecast/top?${App.bq()}&limit=15`); $('#top').innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>SKU</th><th>สินค้า</th><th class="num">ขาย 12 เดือน</th><th class="num">คงเหลือ</th><th class="num">วันคงคลัง</th>${top[0]?.forecast.slice(1).map(x => `<th class="num">${ymLabel(x.ym)}</th>`).join('') || ''}<th>แนวโน้ม</th><th class="num">ความแม่น</th><th class="num">แนะนำสั่ง</th></tr></thead><tbody>${top.map(t => `<tr class="click" data-id="${t.product_id}"><td>${esc(t.sku)}</td><td class="ell" style="max-width:16rem">${esc(t.name)}</td><td class="num b">${num(t.qty)}</td><td class="num">${num(t.on_hand)}</td><td class="num ${t.days_cover <= 7 ? 'red b' : ''}">${t.days_cover >= 999 ? '∞' : t.days_cover}</td>${t.forecast.slice(1).map(x => `<td class="num amber">${x.qty}</td>`).join('')}<td>${UI.pill(t.trend)}</td><td class="num">${t.accuracy}%</td><td class="num ${t.suggest_qty ? 'red b' : ''}">${t.suggest_qty || '-'}</td></tr>`).join('')}</tbody></table></div>`;
  $('#top').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) showProduct(+tr.dataset.id); };
  $('#pick').onclick = async () => { const p = await UI.pickProduct(); if (p) showProduct(p.id); }; $('#plan').onclick = () => reorderPlanView();
  if (params.product) showProduct(+params.product);
};

<script>
/* ============================================================

/* ===================== MKT Think! ===================== */
Pages.mkt = async (main, params) => {
  let tab = App.firstTab('mkt', params.tab || 'think'); const isMkt = ['owner', 'hq_manager', 'marketing', 'branch_manager'].includes(App.user.role);
  main.innerHTML = head('MKT Think! <span class="ai-badge">AI</span>', 'สรุปการตลาดส่วนกลาง · Marketing Point ทุกสาขาไหลเข้าที่เดียว · คอนเทนต์สตูดิโอ AI · แคมเปญ') + '<div id="seg" class="mb"></div><div id="out"></div>';
  $('#seg').appendChild(UI.seg(App.tabs('mkt', [{ v: 'think', l: '💡 สรุปการตลาด' }, { v: 'points', l: '⭐ Marketing Point' }, { v: 'studio', l: '🎨 คอนเทนต์สตูดิโอ AI' }, { v: 'posts', l: '📝 คอนเทนต์' }, { v: 'camp', l: '📣 แคมเปญ' }]), tab, v => { tab = v; load(); }));
  const out = $('#out');
  const load = async () => { out.innerHTML = UI.loading();
    if (tab === 'think') { const d = await API.get('/mkt/summary'); const tot = d.board.reduce((s, b) => s + b.verified, 0); const posts = Object.fromEntries(d.posts.map(p => [p.status, p.n]));
      out.innerHTML = `<div class="grid g4 mb">${kpi('Marketing Point เดือนนี้', num(tot), `รอตรวจ ${num(d.board.reduce((s, b) => s + b.pending, 0))}`, 'amber', '⭐')}${kpi('แคมเปญกำลังทำ', d.campaigns.filter(c => c.status === 'active').length, `งบรวม ${money(d.campaigns.filter(c => c.status === 'active').reduce((s, c) => s + c.budget, 0))}`, '', '📣')}${kpi('แชท 30 วัน', num(d.chat.msgs30), `AI ตอบ ${num(d.chat.ai_replies)} · ออเดอร์จากแชท ${d.chat.orders}`, '', '💬')}${kpi('คอนเทนต์รออนุมัติ', (posts.draft || 0) + (posts.review || 0), `โพสต์แล้ว ${posts.posted || 0}`, (posts.draft || posts.review) ? 'amber' : '', '📝')}</div>
        <div class="grid g-2-1 mb"><div class="card"><h3>กระดาน Marketing Point รายสาขา <span class="r">${d.month}</span></h3><div id="bd"></div></div><div class="card"><h3>ยอดขายช่องทางออนไลน์ (เดือนนี้)</h3><div id="on"></div></div></div>
        <div class="grid g-1-2 mb"><div class="card"><h3>กิจกรรมที่ทำมากสุด</h3><div id="ac"></div></div><div class="card"><h3>แนวโน้มคะแนน 6 เดือน + ฤดูกาลอะไหล่แอร์</h3><div id="tr"></div><p class="tiny muted mt">แถบเทา = ดัชนีฤดูกาล (มี.ค.–พ.ค. คือช่วงทอง) วางแผนแคมเปญล่วงหน้า 4–6 สัปดาห์</p></div></div>
        <div class="card"><h3>แคมเปญล่าสุด</h3><div class="grid g3">${d.campaigns.slice(0, 6).map(c => campCard(c)).join('')}</div></div>
        ${App.aiReady && isMkt ? '<div class="mt"><button class="btn amber" id="ai">🤖 ให้ AI วิเคราะห์การตลาดและแนะนำแคมเปญเดือนหน้า</button></div>' : ''}`;
      Chart.bars($('#bd'), d.board.map(b => ({ k: b.code, v: b.verified, extra: `รอตรวจ ${b.pending} · ${b.activities} กิจกรรม` })), { h: 200 }); Chart.donut($('#on'), d.online.map(o => ({ k: CH[o.channel] || o.channel, v: o.amt })), { fmt: money }); Chart.bars($('#ac'), d.by_activity.filter(a => a.n).map(a => ({ k: a.name, v: a.points, extra: a.n + ' ครั้ง' })), { horizontal: true });
      const months = Array.from({ length: 6 }, (_, i) => { const dte = new Date(); dte.setMonth(dte.getMonth() - 5 + i); return dte.toISOString().slice(0, 7); }); const tm = Object.fromEntries(d.trend.map(t => [t.ym, t.pts])); Chart.lines($('#tr'), [{ name: 'คะแนนยืนยันแล้ว', color: Chart.C.a, area: true, values: months.map(m => tm[m] || 0) }, { name: 'ดัชนีฤดูกาล ×100', color: Chart.C.b, dashed: true, values: months.map(m => Math.round(d.season_hint[+m.slice(5) - 1] * 100)) }], { labels: months.map(ymLabel), h: 180 });
      const ai = $('#ai'); if (ai) ai.onclick = () => aiInsight('marketing'); }
    else if (tab === 'points') { const [acts, rows] = await Promise.all([API.get('/mkt/activities'), API.get(`/mkt/points?${App.bq()}`)]);
      out.innerHTML = `<div class="grid g-1-2"><div class="card"><h3>➕ บันทึกกิจกรรมการตลาด</h3><div class="f"><label><span>กิจกรรม</span><select id="act">${acts.map(a => `<option value="${a.code}">${esc(a.name)} (+${a.points})</option>`).join('')}</select></label><label><span>หลักฐาน (ลิงก์โพสต์/รูป)</span><input id="ev" placeholder="https://facebook.com/..."></label><label><span>หมายเหตุ</span><input id="nt"></label><button class="btn amber" id="add">ส่งให้ส่วนกลางตรวจ</button></div><p class="tiny muted mt">คะแนนจะเข้ากระดานเมื่อฝ่ายการตลาดส่วนกลางยืนยัน · ตรวจของตัวเองไม่ได้</p></div>
        <div class="card pad0"><div style="padding:0.9333rem 1.0667rem 0"><h3>รายการคะแนน</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>วันที่</th><th>สาขา</th><th>กิจกรรม</th><th class="num">คะแนน</th><th>โดย</th><th>หลักฐาน</th><th>สถานะ</th>${['owner', 'hq_manager', 'marketing'].includes(App.user.role) ? '<th></th>' : ''}</tr></thead><tbody>${rows.map(r => `<tr><td>${dd(r.created_at)}</td><td>${esc(r.bcode)}</td><td>${esc(r.activity_name)}</td><td class="num b amber">+${r.points}</td><td>${esc(r.staff_name || '')}</td><td>${r.evidence_url ? `<a href="${esc(r.evidence_url)}" target="_blank" class="amber">🔗 ดู</a>` : '-'}</td><td>${UI.pill(r.status)}</td>${['owner', 'hq_manager', 'marketing'].includes(App.user.role) ? `<td>${r.status === 'pending' ? `<button class="btn sm green" data-v="verified:${r.id}">✓</button> <button class="btn sm ghost red" data-v="rejected:${r.id}">✕</button>` : ''}</td>` : ''}</tr>`).join('') || '<tr><td colspan="8" class="muted center">ยังไม่มีรายการ</td></tr>'}</tbody></table></div></div></div>`;
      $('#add').onclick = async () => { try { const r = await API.post('/mkt/points', { activity_code: $('#act').value, evidence_url: $('#ev').value, note: $('#nt').value, branch_id: curBranch() }); UI.ok(`บันทึกแล้ว +${r.points} คะแนน (รอตรวจ)`); load(); } catch (e) { UI.err(e.message); } };

Pages.income = async (main, params) => {
  main.innerHTML = head('รายรับ', 'ยอดขายรายบิลเรียงตามเวลา · เลือกช่วงวันที่ วันนี้ เดือนนี้ ปีนี้ ปีที่แล้ว หรือกำหนดเอง (พ.ศ.) · ค้นหาเลขที่บิล ชื่อลูกค้า เบอร์โทร') + `<div class="toolbar"><div id="rng"></div><div class="search"><input id="q" placeholder="เลขที่บิล / ลูกค้า / โทร"></div><select id="pm"><option value="">ทุกวิธีชำระ</option>${Object.entries(PAY_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select><select id="st"><option value="">ทุกสถานะ</option><option value="paid">ชำระแล้ว</option><option value="partial">คงค้างบางส่วน</option><option value="void">ยกเลิก</option></select></div><div id="sum" class="mb"></div><div id="list"></div>`;
  const rng = UI.range({ key: 'income', preset: 'today', presets: ['today', 'week', 'month', 'lastMonth', 'year', 'lastYear', 'custom'] }, () => load()); $('#rng').appendChild(rng);
  const load = async () => { $('#list').innerHTML = UI.loading();

    rows = rows.filter(s => (!pm || s.payment_method === pm) && (!st || s.status === st)).sort((a, b) => a.created_at.localeCompare(b.created_at));
    const live = rows.filter(s => s.status !== 'void'); const tot = live.reduce((a, s) => a + s.total, 0), got = live.reduce((a, s) => a + (s.status === 'partial' ? s.paid : s.total), 0);
    const byM = {}; live.forEach(s => { byM[s.payment_method] = (byM[s.payment_method] || 0) + (s.status === 'partial' ? s.paid : s.total); });

/* ปรับจำนวนสาขาที่ใช้งาน: เพิ่ม = เปิดสาขาที่ปิดไว้ก่อน แล้วสร้างรหัสถัดไป 0001, 0002, … / ลด = ปิดใช้งานสาขาท้ายสุด (ข้อมูลยังอยู่) */
async function applyBranchCount(n, refresh) {
  const want = Math.max(0, Math.min(200, +n || 0)); const list = App.branches.filter(b => !b.is_hq && !b.is_online).sort((a, b) => a.code.localeCompare(b.code)); const active = list.filter(b => b.active);
  try {
    if (want > active.length) { let need = want - active.length; for (const b of list.filter(b => !b.active && /^\d{4}$/.test(b.code))) { if (!need) break; await API.put('/branches/' + b.id, { active: 1 }); need--; } let next = Math.max(0, ...App.branches.map(b => +b.code || 0)) + 1; while (need > 0) { const code = String(next++).padStart(4, '0'); await API.post('/branches', { code, name: `สาขา ${code}`, province: '-', address: `ที่อยู่สาขา ${code}`, phone: '', color: '#f97316', is_online: 0 }); need--; } UI.ok(`ตั้งค่าเป็น ${want} สาขาแล้ว ตั้งชื่อแต่ละสาขาได้ที่เมนู ตั้งค่าสาขา`); }
    else if (want < active.length) { const k = active.length - want; if (!await UI.confirm('ลดจำนวนสาขา', `จะปิดใช้งานสาขาท้ายสุด ${k} สาขา (ข้อมูลยังอยู่ เปิดกลับได้)`)) return; for (const b of active.slice(-k)) await API.put('/branches/' + b.id, { active: 0 }); UI.ok(`ปิดใช้งาน ${k} สาขาแล้ว`); }
    else UI.toast('จำนวนสาขาเท่าเดิม');
  } catch (err) { UI.err(err.message); }
  App.branches = await API.get('/branches'); refresh && refresh();
}

      <div class="card"><h3>🖼️ ผู้ให้บริการสร้างภาพ</h3><div class="f"><label><span>วิธีสร้างภาพโปสเตอร์</span><select id="image_provider"><option value="builtin" ${s.image_provider !== 'openai_compatible' ? 'selected' : ''}>เทมเพลตในระบบ (SVG, ไม่มีค่าใช้จ่าย)</option><option value="openai_compatible" ${s.image_provider === 'openai_compatible' ? 'selected' : ''}>API ภายนอกแบบ OpenAI-compatible (images/generations)</option></select></label><label><span>Image API URL</span><input id="image_api_url" value="${esc(s.image_api_url || '')}" placeholder="https://api.openai.com/v1/images/generations"></label><label><span>Image API Key</span><input id="image_api_key" type="password" value="${esc(s.image_api_key || '')}"></label><label><span>Image Model</span><input id="image_model" value="${esc(s.image_model || '')}" placeholder="เช่น gpt-image-1"></label><button class="btn amber" id="save2">💾 บันทึก</button></div><h3 class="mt2">การใช้งาน 30 วัน</h3><table class="tbl">${usage.map(u => `<tr><td>${esc(u.kind)}</td><td class="num">${u.n} ครั้ง</td><td class="num">${num(u.tin)} / ${num(u.tout)} tokens</td></tr>`).join('') || '<tr><td class="muted">ยังไม่มีการใช้งาน</td></tr>'}</table></div></div>`;
      $('#save').onclick = async () => { await API.put('/settings', { anthropic_api_key: $('#anthropic_api_key').value, ai_model: $('#ai_model').value, ai_persona: $('#ai_persona').value }); UI.ok('บันทึกแล้ว'); App.aiReady = (await API.get('/ai/status')).ready; load(); }; $('#save2').onclick = async () => { await API.put('/settings', { image_provider: $('#image_provider').value, image_api_url: $('#image_api_url').value, image_api_key: $('#image_api_key').value, image_model: $('#image_model').value }); UI.ok('บันทึกแล้ว'); }; $('#test').onclick = async () => { try { const r = await API.post('/ai/test'); UI.alert('เชื่อมต่อสำเร็จ', esc(r.text), { kind: 'success' }); } catch (e) { UI.alert('เชื่อมต่อไม่ได้', esc(e.message)); } }; }
    else { const cats = await API.get('/categories'); let newImg = ''; const slot = (src, attr) => `<div class="imgslot catimg" ${attr} title="${src ? 'เปลี่ยนรูป' : 'เพิ่มรูปภาพหมวด'}">${src ? `<img src="${esc(src)}"><button class="rm" data-rmimg="1">✕</button>` : '<span class="no">＋</span>'}</div>`;
      out.innerHTML = `<div class="card" style="max-width:61.3333rem"><div class="grid g4 mb" style="align-items:end"><label><span class="small muted">รูปหมวด</span>${slot('', 'data-newimg="1"')}</label><label><span class="small muted">รหัส</span><input id="cc" placeholder="EV-BAT"></label><label><span class="small muted">ชื่อหมวด</span><input id="cn" placeholder="แบตเตอรี่ EV"></label><label><span class="small muted">ฤดูกาลพยากรณ์</span><select id="cs"><option value="flat">ไม่มีฤดูกาล</option><option value="ac">แอร์ (หน้าร้อนพุ่ง)</option><option value="battery">แบตเตอรี่</option></select></label></div><button class="btn amber mb" id="ca">➕ เพิ่มหมวด</button><input type="file" id="cfi" accept="image/*" hidden><div class="tbl-wrap"><table class="tbl"><thead><tr><th>รูป</th><th>รหัส</th><th>ชื่อ</th><th>ฤดูกาล</th><th class="num">สินค้า</th></tr></thead><tbody>${cats.map(c => `<tr><td>${slot(c.img, `data-cimg="${c.id}"`)}</td><td>${esc(c.code)}</td><td><input value="${esc(c.name)}" data-n="${c.id}"></td><td><select data-s="${c.id}">${['flat', 'ac', 'battery'].map(k => `<option value="${k}" ${c.seasonal === k ? 'selected' : ''}>${{ flat: 'ไม่มี', ac: 'แอร์', battery: 'แบตเตอรี่' }[k]}</option>`).join('')}</select></td><td class="num">${c.n}</td></tr>`).join('')}</tbody></table></div><p class="tiny muted mt">แตะกรอบ ＋ เพื่อเพิ่มรูปภาพหมวด รูปจะแสดงบนแถบหมวดในหน้า POS</p></div>`;
      const cfi = $('#cfi'); let target = null;
      out.onclick = async e => { const rm = e.target.closest('[data-rmimg]'); if (rm) { const sl = rm.closest('.catimg'); if (sl.dataset.cimg) { try { await API.put('/categories/' + sl.dataset.cimg, { img: '' }); UI.ok('ลบรูปแล้ว'); load(); } catch (e) { UI.err(e.message); } } else { newImg = ''; sl.innerHTML = '<span class="no">＋</span>'; } return; } const sl = e.target.closest('.catimg'); if (sl) { target = sl; cfi.click(); } };
      cfi.onchange = async () => { if (!cfi.files[0] || !target) return; try { UI.toast('กำลังอัปโหลด…'); const r = await API.upload(cfi.files[0]); if (target.dataset.cimg) { await API.put('/categories/' + target.dataset.cimg, { img: r.url }); UI.ok('บันทึกรูปหมวดแล้ว'); load(); } else { newImg = r.url; target.innerHTML = `<img src="${esc(r.url)}"><button class="rm" data-rmimg="1">✕</button>`; } } catch (e) { UI.err(e.message); } cfi.value = ''; };
      $('#ca').onclick = async () => { try { await API.post('/categories', { code: $('#cc').value, name: $('#cn').value, seasonal: $('#cs').value, img: newImg }); UI.ok('เพิ่มแล้ว'); load(); } catch (e) { UI.err(e.message); } }; out.onchange = async e => { const id = e.target.dataset.n || e.target.dataset.s; if (!id) return; await API.put('/categories/' + id, e.target.dataset.n ? { name: e.target.value } : { seasonal: e.target.value }); UI.ok('บันทึกแล้ว'); }; } };
  load();
};

<script>
/* ============================================================
   AC711 page: บัญชี & การเงิน — ลูกหนี้ / เจ้าหนี้ / ตัดชำระ / สมุดรายวัน / งบการเงิน / ภาษี / ปิดงวด
   ============================================================ */
const AC = { asset: 'สินทรัพย์', liability: 'หนี้สิน', equity: 'ส่วนของเจ้าของ', revenue: 'รายได้', expense: 'ค่าใช้จ่าย' };
const JN = { GJ: 'รายวันทั่วไป', SJ: 'รายวันขาย', PJ: 'รายวันซื้อ', CR: 'รายวันรับเงิน', CP: 'รายวันจ่ายเงิน' };
const PM = { cash: 'เงินสด', transfer: 'โอน', promptpay: 'PromptPay', card: 'บัตร', cheque: 'เช็ค', platform_payout: 'แพลตฟอร์มโอนให้', credit: 'เครดิต' };
const money2 = n => (+n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const amt = n => `<span class="num ${n < 0 ? 'red' : ''}">${n < 0 ? '(' + money2(-n) + ')' : money2(n)}</span>`;
const isFin = () => ['owner', 'hq_manager', 'accountant'].includes(App.user.role);

Pages.finance = async (main, params) => {
  if (!App.can('finance')) return main.innerHTML = UI.empty('บทบาทของคุณไม่มีสิทธิ์เข้าถึงบัญชี', '🔒');
  let tab = App.firstTab('finance', params.tab || 'overview');
  main.innerHTML = head('บัญชี & การเงิน', 'ลูกหนี้-เจ้าหนี้ · ตัดชำระหนี้ · สมุดรายวัน 5 เล่ม · บัญชีแยกประเภท · งบการเงินตามรูปแบบกรมพัฒนาธุรกิจการค้า · ภ.พ.30 / ภ.ง.ด.3-53') + '<div id="seg" class="mb"></div><div id="out"></div>';
  $('#seg').appendChild(UI.seg(App.tabs('finance', [{ v: 'overview', l: '💼 ภาพรวม' }, { v: 'ar', l: '📥 ลูกหนี้' }, { v: 'ap', l: '📤 เจ้าหนี้' }, { v: 'journal', l: '📓 สมุดรายวัน' }, { v: 'ledger', l: '📒 แยกประเภท/งบทดลอง' }, { v: 'statements', l: '📑 งบการเงิน' }, { v: 'tax', l: '🧾 ภาษี' }, { v: 'coa', l: '🗂️ ผังบัญชี' }, { v: 'close', l: '🔒 ปิดงวด' }]), tab, v => { tab = v; load(); }));
  const out = $('#out');
  const load = async () => { out.innerHTML = UI.loading(); try { await ({ overview: finOverview, ar: finAR, ap: finAP, journal: finJournal, ledger: finLedger, statements: finStatements, tax: finTax, coa: finCOA, close: finClose })[tab](out, params); } catch (e) { out.innerHTML = `<div class="card"><p class="red">${esc(e.message)}</p></div>`; } };
  App.on('finance', () => ['overview', 'ar', 'ap'].includes(tab) && load()); App.on('approval', () => ['overview', 'ap'].includes(tab) && load());
  load();
};

/* ===== ภาพรวม ===== */
async function finOverview(out) {
  const d = await API.get(`/finance/overview?${App.bq()}`);
  out.innerHTML = `<div class="grid g4">${kpi('เงินสดในมือ', money(d.cash), 'บัญชี 1110', 'amber', '💵')}${kpi('เงินฝากธนาคาร', money(d.bank), 'บัญชี 1120', '', '🏦')}${kpi('ลูกหนี้คงค้าง', money(d.ar_total), `เกินกำหนด ${money(d.ar_overdue)} · แพลตฟอร์ม ${money(d.ar_platform)}`, d.ar_overdue ? 'red' : '', '📥')}${kpi('เจ้าหนี้คงค้าง', money(d.ap_total), `เกินกำหนด ${money(d.ap_overdue)}`, d.ap_overdue ? 'red' : '', '📤')}</div>
    <div class="grid g4 mt">${kpi('รายได้เดือนนี้ (ไม่รวม VAT)', money(d.month.revenue), `กำไรขั้นต้น ${money(d.month.gross)}`)}${kpi('กำไรสุทธิเดือนนี้', money(d.month.net), `ค่าใช้จ่าย ${money(d.month.expenses)}`, d.month.net < 0 ? 'red' : 'amber')}${kpi(`ภ.พ.30 งวด ${ymLabel(d.vat.period)}`, money(d.vat.net), `ภาษีขาย ${money(d.vat.output)} − ภาษีซื้อ ${money(d.vat.input)}`)}${kpi('ใบสำคัญจ่ายรออนุมัติ', d.pending_payments.c, `${money(d.pending_payments.s)} · ใบลดหนี้รอ ${d.pending_cn}`, d.pending_payments.c ? 'amber' : '')}</div>
    <div class="grid g2 mt"><div class="card"><h3>🔴 ลูกหนี้เกินกำหนด</h3>${d.overdue_ar.length ? `<div class="list">${d.overdue_ar.map(i => `<div class="row" style="height:3.6rem;padding:0 0.2667rem"><div class="m"><b>${esc(i.partner_name)}</b><span>${esc(i.code)} · ครบกำหนด ${dd(i.due_date)} · เกิน ${i.overdue} วัน</span></div><div class="e"><b class="red">${money(i.balance)}</b></div></div>`).join('')}</div>` : UI.empty('ไม่มีลูกหนี้เกินกำหนด', '✅')}</div>
    <div class="card"><h3>⏰ เจ้าหนี้ครบกำหนดใน 7 วัน</h3>${d.due_soon_ap.length ? `<div class="list">${d.due_soon_ap.map(i => `<div class="row" style="height:3.6rem;padding:0 0.2667rem"><div class="m"><b>${esc(i.partner_name)}</b><span>${esc(i.code)} · ครบกำหนด ${dd(i.due_date)}</span></div><div class="e"><b>${money(i.balance)}</b></div></div>`).join('')}</div>` : UI.empty('ไม่มีรายการใกล้ครบกำหนด', '✅')}</div></div>
    <div class="card mt"><h3>📋 สิ่งที่ระบบจัดทำให้ตามกฎหมายบัญชี</h3><div class="grid g3 small"><div>✅ สมุดรายวันทั่วไป / ซื้อ / ขาย / รับเงิน / จ่ายเงิน (โพสต์อัตโนมัติจากทุกเอกสาร)</div><div>✅ บัญชีแยกประเภททั่วไป + แยกประเภทลูกหนี้-เจ้าหนี้รายตัว + บัญชีสินค้า (ล็อต FIFO/FEFO)</div><div>✅ งบทดลอง · งบแสดงฐานะการเงิน · งบกำไรขาดทุน · งบแสดงการเปลี่ยนแปลงส่วนของเจ้าของ</div><div>✅ รายงานภาษีซื้อ-ภาษีขายรายเดือน (ภ.พ.30) และรายการหัก ณ ที่จ่าย (ภ.ง.ด.3/53)</div><div>✅ ล็อกงวดบัญชี ${d.closed_through ? 'ถึง ' + dd(d.closed_through) : '(ยังไม่ปิดงวด)'} และปิดบัญชีประจำปี</div><div>✅ ผู้ขอ ≠ ผู้อนุมัติ ในการจ่ายเงิน/ลดหนี้ + audit log โซ่แฮช</div></div><p class="tiny muted mt">งวดบัญชีเริ่มเดือน ${d.fiscal_start_month} · รายการเดือนนี้ ${d.entries} รายการ · ยื่นงบการเงินผ่าน DBD e-Filing ภายใน 5 เดือนหลังวันสิ้นรอบบัญชี (ส่งออก CSV จากแท็บงบการเงินให้ผู้ทำบัญชี)</p></div>`;
}

/* ===== ลูกหนี้ ===== */
async function finAR(out, params = {}) {
  let status = 'open', sub = 'inv';
  out.innerHTML = `<div class="toolbar"><div id="sub"></div><div class="search"><input id="q" placeholder="เลขที่บิล / ชื่อลูกหนี้"></div><select id="st"><option value="open">คงค้าง</option><option value="paid">ชำระแล้ว</option><option value="cancelled">ยกเลิก</option><option value="">ทั้งหมด</option></select><button class="btn amber" id="rcv">💰 รับชำระหนี้</button><button class="btn" id="cn">↩️ ใบลดหนี้</button><button class="btn" id="aging">⏳ อายุลูกหนี้</button></div><div id="list"></div>`;
  $('#sub').appendChild(UI.seg([{ v: 'inv', l: 'ใบแจ้งหนี้' }, { v: 'partner', l: 'รายลูกหนี้' }, { v: 'rc', l: 'ใบเสร็จรับเงิน' }, { v: 'cnl', l: 'ใบลดหนี้' }], sub, v => { sub = v; render(); }));
  const list = $('#list');
  const render = async () => { list.innerHTML = UI.loading();

  let journal = ''; const ym = today().slice(0, 7);
