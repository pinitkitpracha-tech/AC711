  let t; $('#q').oninput = () => { clearTimeout(t); t = setTimeout(render, 250); }; $('#p').onchange = render; const nb = $('#new'); if (nb) nb.onclick = () => journalForm(render); render();

async function entryView(id, refresh) { const e = await API.get('/finance/journal/' + id); UI.modal({ title: `${esc(e.code)} · ${JN[e.journal] || e.journal}`, size: 'lg', foot: `<button class="btn ghost" onclick="this.closest('.modal-bg').remove()">ปิด</button>${histBtn('journal_entries', e.id, e.ref_code || e.code, '')}${isFin() && e.status === 'posted' && e.ref_type === 'manual' ? '<button class="btn red" id="rev">↩️ กลับรายการ</button>' : ''}`, body: `<p class="small muted">${dd(e.doc_date)} · ${esc(e.description)} · อ้างอิง ${esc(e.ref_code || e.ref_type)} · โดย ${esc(e.staff_name || 'ระบบ')}</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>รหัส</th><th>ชื่อบัญชี</th><th class="num">เดบิต</th><th class="num">เครดิต</th><th>บันทึก</th></tr></thead><tbody>${e.lines.map(l => `<tr><td>${esc(l.acode)}</td><td style="padding-left:${l.credit ? 32 : 12}px">${esc(l.aname)}</td><td class="num">${l.debit ? money2(l.debit) : ''}</td><td class="num">${l.credit ? money2(l.credit) : ''}</td><td class="tiny muted">${esc(l.memo)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2" class="right b">รวม</td><td class="num b">${money2(e.total)}</td><td class="num b">${money2(e.total)}</td><td></td></tr></tfoot></table></div>` }).el.querySelector('#rev')?.addEventListener('click', async ev => { if (!await UI.confirm('กลับรายการ', 'สร้างรายการกลับด้าน (ไม่ลบของเดิม) ตามหลักบัญชี?')) return; try { await API.post(`/finance/journal/${id}/reverse`); UI.ok('กลับรายการแล้ว'); ev.target.closest('.modal-bg').remove(); refresh(); } catch (e2) { UI.err(e2.message); } }); }
async function journalForm(refresh) { const accs = (await API.get('/finance/accounts')).filter(a => !['1130', '1131', '2110'].includes(a.code)); let lines = [{}, {}]; const m = UI.modal({ title: '✍️ บันทึกรายการในสมุดรายวันทั่วไป', size: 'lg', foot: `<button class="btn ghost" id="x">ยกเลิก</button><button class="btn amber" id="s">โพสต์รายการ</button>`, body: `<div class="grid g2 f mb"><label><span>วันที่</span><input type="date" id="d" value="${today()}"></label><label><span>สาขา (ถ้ามี)</span>${branchSel('br', App.branch || '', true)}</label><label style="grid-column:1/-1"><span>คำอธิบาย *</span><input id="desc" placeholder="เช่น บันทึกค่าเสื่อมราคาอุปกรณ์ประจำเดือน"></label></div><div class="tbl-wrap card pad0"><table class="tbl"><thead><tr><th>บัญชี</th><th class="w90">เดบิต</th><th class="w90">เครดิต</th><th>บันทึก</th><th></th></tr></thead><tbody id="tb"></tbody><tfoot><tr><td class="right b">รวม</td><td class="num b" id="td">0.00</td><td class="num b" id="tc">0.00</td><td colspan="2" id="bal" class="tiny"></td></tr></tfoot></table></div><button class="btn sm mt" id="add">➕ เพิ่มบรรทัด</button><p class="tiny muted mt">บัญชีคุมลูกหนี้/เจ้าหนี้ (1130, 1131, 2110) บันทึกผ่านเอกสารรับ-จ่ายชำระเท่านั้น</p>` }); const tb = $('#tb', m.el); const render = () => { tb.innerHTML = lines.map((l, i) => `<tr><td><select class="ac" data-i="${i}"><option value="">เลือกบัญชี…</option>${accs.map(a => `<option value="${a.code}" ${l.account === a.code ? 'selected' : ''}>${a.code} ${esc(a.name)}</option>`).join('')}</select></td><td><input type="number" step="0.01" class="dr" data-i="${i}" value="${l.debit || ''}"></td><td><input type="number" step="0.01" class="cr" data-i="${i}" value="${l.credit || ''}"></td><td><input class="mm" data-i="${i}" value="${esc(l.memo || '')}"></td><td><button class="btn sm ghost red" data-rm="${i}">✕</button></td></tr>`).join(''); tot(); }; const tot = () => { const d = lines.reduce((s, l) => s + (+l.debit || 0), 0), c = lines.reduce((s, l) => s + (+l.credit || 0), 0); $('#td', m.el).textContent = money2(d); $('#tc', m.el).textContent = money2(c); $('#bal', m.el).innerHTML = Math.abs(d - c) < 0.005 ? '<span class="green">✓ ดุล</span>' : `<span class="red">ไม่ดุล ต่าง ${money2(d - c)}</span>`; }; render(); tb.oninput = e => { const i = +e.target.dataset.i; if (isNaN(i)) return; const l = lines[i]; if (e.target.classList.contains('ac')) l.account = e.target.value; if (e.target.classList.contains('dr')) l.debit = e.target.value; if (e.target.classList.contains('cr')) l.credit = e.target.value; if (e.target.classList.contains('mm')) l.memo = e.target.value; tot(); }; tb.onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { lines.splice(+b.dataset.rm, 1); render(); } }; $('#add', m.el).onclick = () => { lines.push({}); render(); }; $('#x', m.el).onclick = m.close; $('#s', m.el).onclick = async () => { try { await API.post('/finance/journal', { doc_date: $('#d', m.el).value, branch_id: +$('#br', m.el).value || null, description: $('#desc', m.el).value, lines: lines.filter(l => l.account).map(l => ({ account: l.account, debit: +l.debit || 0, credit: +l.credit || 0, memo: l.memo || '' })) }); m.close(); UI.ok('โพสต์รายการแล้ว'); refresh && refresh(); } catch (e) { UI.alert('โพสต์ไม่ได้', esc(e.message)); } }; }

async function finStatements(out) {
  const y = today().slice(0, 4); let kind = 'bs';
  out.innerHTML = `<div class="toolbar"><div id="k"></div><label class="flex" style="gap:0.4rem"><span class="small muted">ณ วันที่ / ถึง</span><input type="date" id="as" value="${today()}" style="width:auto"></label><label class="flex" style="gap:0.4rem"><span class="small muted">ปี</span><input type="number" id="y" value="${+y + 543}" style="width:6.6667rem" title="ปี พ.ศ."></label><button class="btn" id="csv">⬇️ CSV (ส่งผู้ทำบัญชี)</button><button class="btn" onclick="window.print()">🖨️ พิมพ์</button></div><div id="st"></div>`;

    else if (kind === 'pl') { const d = await API.get(`/finance/income-statement?year=${yy}&to=${as}&${App.bq()}`); const grp = (t, rows, ind = 1) => rows.filter(r => Math.abs(r.balance) > 0.004).map(r => line(r.code + ' ' + r.name, r.balance, false, ind)).join(''); $('#st').innerHTML = `<div class="card print-area" style="max-width:54.6667rem">${hdr('งบกำไรขาดทุน', `สำหรับงวด ${dd(d.from)} ถึง ${dd(d.to)} (หน่วย: บาท)`)}<div class="tbl-wrap"><table class="tbl stmt"><tbody><tr><td class="b amber" colspan="2">รายได้</td></tr>${grp('', d.sales)}${line('รายได้จากการขายสุทธิ', d.net_sales, true)}<tr><td class="b" colspan="2">ต้นทุนขาย</td></tr>${grp('', d.cogs)}${line('รวมต้นทุนขาย', d.cost_of_sales, true)}${line('กำไรขั้นต้น', d.gross_profit, true)}${grp('', d.other_income)}${d.other_income_total ? line('รวมรายได้อื่น', d.other_income_total, true) : ''}<tr><td class="b" colspan="2">ค่าใช้จ่ายในการขายและบริหาร</td></tr>${grp('', d.selling_admin)}${line('รวมค่าใช้จ่ายในการขายและบริหาร', d.expenses_total, true)}${line('กำไร (ขาดทุน) ก่อนภาษีเงินได้', d.profit_before_tax, true)}${grp('', d.tax)}${line('กำไร (ขาดทุน) สุทธิ', d.net_profit, true)}</tbody></table></div><p class="tiny muted mt">อัตรากำไรขั้นต้น ${d.net_sales ? Math.round(d.gross_profit / d.net_sales * 1000) / 10 : 0}% · อัตรากำไรสุทธิ ${d.net_sales ? Math.round(d.net_profit / d.net_sales * 1000) / 10 : 0}%</p></div>`; csvRows = [...d.sales, ...d.cogs, ...d.other_income, ...d.selling_admin, ...d.tax].map(r => ({ code: r.code, name: r.name, balance: r.balance })).concat([{ code: '', name: 'กำไรสุทธิ', balance: d.net_profit }]); }
    else { const d = await API.get(`/finance/equity-statement?year=${yy}&${App.bq()}`); $('#st').innerHTML = `<div class="card print-area" style="max-width:54.6667rem">${hdr('งบแสดงการเปลี่ยนแปลงส่วนของเจ้าของ', `สำหรับงวด ${dd(d.from)} ถึง ${dd(d.to)} (หน่วย: บาท)`)}<div class="tbl-wrap"><table class="tbl stmt"><thead><tr><th></th><th class="num">ทุน</th><th class="num">กำไรสะสม</th><th class="num">รวม</th></tr></thead><tbody><tr><td>ยอดคงเหลือต้นงวด</td><td class="num">${money2(d.capital_open)}</td><td class="num">${money2(d.retained_open)}</td><td class="num">${money2(d.capital_open + d.retained_open)}</td></tr><tr><td>เพิ่มทุน (ลดทุน)</td><td class="num">${money2(d.capital_add)}</td><td class="num">-</td><td class="num">${money2(d.capital_add)}</td></tr><tr><td>กำไร (ขาดทุน) สุทธิสำหรับงวด</td><td class="num">-</td><td class="num">${money2(d.net_profit)}</td><td class="num">${money2(d.net_profit)}</td></tr><tr><td>ถอนใช้ส่วนตัว / เงินปันผล</td><td class="num">-</td><td class="num">${amt(d.drawings)}</td><td class="num">${amt(d.drawings)}</td></tr><tr class="b"><td>ยอดคงเหลือปลายงวด</td><td class="num">${money2(d.capital_close)}</td><td class="num">${money2(d.retained_close)}</td><td class="num amber">${money2(d.total_close)}</td></tr></tbody></table></div></div>`; csvRows = [{ item: 'ทุนต้นงวด', value: d.capital_open }, { item: 'กำไรสะสมต้นงวด', value: d.retained_open }, { item: 'เพิ่มทุน', value: d.capital_add }, { item: 'กำไรสุทธิ', value: d.net_profit }, { item: 'ถอนใช้ส่วนตัว', value: d.drawings }, { item: 'รวมปลายงวด', value: d.total_close }]; } };
  $('#as').onchange = render; $('#y').onchange = render; $('#csv').onclick = () => dlCsv(csvRows, kind); render();

function dlCsv(rows, name) { if (!rows.length) return UI.err('ไม่มีข้อมูล'); const keys = Object.keys(rows[0]); const s = [keys.join(','), ...rows.map(r => keys.map(k => `"${String(r[k] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + s], { type: 'text/csv' })); a.download = name + '.csv'; a.click(); }

tner_name)}</td><td class="num">${money2(s.base)}</td><td class="num">${money2(s.vat)}</td><td class="num">${money2(s.amount)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted center">ไม่มีรายการ</td></tr>'}</tbody></table></div></div>`; csvRows = [...d.sales.map(s => ({ type: 'ขาย', date: s.doc_date, doc: s.code, partner: s.customer_name, base: s.base, vat: s.vat, total: s.total })), ...d.purchases.map(s => ({ type: 'ซื้อ', date: s.doc_date, doc: s.code, partner: s.partner_name, base: s.base, vat: s.vat, total: s.amount }))]; }
    else { const rows = await API.get('/finance/wht?period=' + p); $('#tx').innerHTML = `<div class="card pad0 tbl-wrap print-area"><div style="padding:0.9333rem 1.0667rem 0"><h3>รายการภาษีหัก ณ ที่จ่าย เดือน ${p} <span class="r">นำส่งภายในวันที่ 7 ของเดือนถัดไป</span></h3></div><table class="tbl"><thead><tr><th>วันที่</th><th>เลขที่</th><th>ผู้ถูกหัก</th><th>เลขผู้เสียภาษี</th><th>แบบ</th><th class="num">เงินได้</th><th class="num">ภาษีที่หัก</th><th class="num">จ่ายสุทธิ</th></tr></thead><tbody>${rows.map(r => `<tr><td>${dd(r.doc_date)}</td><td>${esc(r.code)}</td><td>${esc(r.partner_name)}</td><td>${esc(r.tax_id || '-')}</td><td>${esc(r.wht_type)}</td><td class="num">${money2(r.gross)}</td><td class="num b">${money2(r.wht)}</td><td class="num">${money2(r.amount)}</td></tr>`).join('') || '<tr><td colspan="8" class="muted center">ไม่มีรายการ</td></tr>'}</tbody><tfoot><tr><td colspan="6" class="right b">รวมภาษีที่หัก</td><td class="num b amber">${money2(rows.reduce((s, r) => s + r.wht, 0))}</td><td></td></tr></tfoot></table></div>`; csvRows = rows; } };

/* ===== ผังบัญชี ===== */
async function finCOA(out) {
  const rows = await API.get('/finance/accounts'); const SUB = { current_asset: 'สินทรัพย์หมุนเวียน', noncurrent_asset: 'สินทรัพย์ไม่หมุนเวียน', current_liab: 'หนี้สินหมุนเวียน', noncurrent_liab: 'หนี้สินไม่หมุนเวียน', equity: 'ส่วนของเจ้าของ', sales: 'รายได้จากการขาย', other_income: 'รายได้อื่น', cogs: 'ต้นทุนขาย', selling_admin: 'ค่าใช้จ่ายขายและบริหาร', tax: 'ภาษีเงินได้' };
  out.innerHTML = `${isFin() ? `<div class="card mb" style="max-width:54.6667rem"><div class="grid g4" style="align-items:end"><label><span class="small muted">รหัส (4 หลัก)</span><input id="cc" placeholder="5295"></label><label><span class="small muted">ชื่อบัญชี</span><input id="cn" placeholder="ค่าประกันภัย"></label><label><span class="small muted">หมวดย่อย</span><select id="cs">${Object.entries(SUB).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label><button class="btn amber" id="ca">➕ เพิ่มบัญชี</button></div></div>` : ''}<div class="card pad0 tbl-wrap"><table class="tbl"><thead><tr><th>รหัส</th><th>ชื่อบัญชี</th><th>หมวด</th><th>หมวดย่อย</th><th>ด้านปกติ</th><th class="num">ยอดคงเหลือ</th><th></th></tr></thead><tbody>${rows.map(a => `<tr><td class="b">${a.code}</td><td>${esc(a.name)} ${a.is_control ? '<span class="pill amber">บัญชีคุม</span>' : ''}</td><td>${AC[a.class]}</td><td class="tiny muted">${SUB[a.sub] || ''}</td><td>${a.normal === 'debit' ? 'เดบิต' : 'เครดิต'}</td><td class="num">${amt(a.balance)}</td><td>${a.active ? '' : '<span class="pill">ปิดใช้</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  const ca = $('#ca'); if (ca) ca.onclick = async () => { const sub = $('#cs').value; const cls = { current_asset: 'asset', noncurrent_asset: 'asset', current_liab: 'liability', noncurrent_liab: 'liability', equity: 'equity', sales: 'revenue', other_income: 'revenue', cogs: 'expense', selling_admin: 'expense', tax: 'expense' }[sub]; try { await API.post('/finance/accounts', { code: $('#cc').value, name: $('#cn').value, class: cls, sub }); UI.ok('เพิ่มบัญชีแล้ว'); finCOA(out); } catch (e) { UI.err(e.message); } };
}

/* ===== ปิดงวด ===== */
async function finClose(out) {
  const d = await API.get('/finance/periods'); const y = today().slice(0, 4); const canClose = ['owner', 'accountant'].includes(App.user.role);
  out.innerHTML = `<div class="grid g2"><div class="card"><h3>🔒 ล็อกงวดบัญชี</h3><p class="small muted">รายการที่มีวันที่ก่อนหรือเท่ากับวันที่ล็อกจะแก้ไข/เพิ่มไม่ได้ ป้องกันการแก้ย้อนหลังหลังนำส่งภาษี · ปัจจุบันปิดถึง <b class="amber">${d.closed_through ? dd(d.closed_through) : 'ยังไม่ปิด'}</b></p>${canClose ? `<div class="flex mt"><input type="date" id="thr" style="width:auto" value="${d.closed_through || ''}"><button class="btn amber" id="cl">ปิดงวดถึงวันที่นี้</button>${App.user.role === 'owner' && d.closed_through ? '<button class="btn ghost red" id="re">เปิดงวดใหม่ (เจ้าของ)</button>' : ''}</div>` : '<p class="tiny muted">เฉพาะเจ้าของ/ฝ่ายบัญชี</p>'}<h3 class="mt2">📅 ปิดบัญชีประจำปี</h3><p class="small muted">โอนยอดรายได้-ค่าใช้จ่ายทั้งปีเข้ากำไรสะสม (บัญชี 3200) ทำหลังผู้สอบบัญชีตรวจเสร็จ แล้วนำส่งงบผ่าน DBD e-Filing ภายใน 5 เดือนนับจากวันสิ้นรอบบัญชี (รอบ ${d.fiscal_year_start_month === 1 ? 'ม.ค.–ธ.ค.' : 'เริ่มเดือน ' + d.fiscal_year_start_month})</p>${canClose ? `<div class="flex mt"><input type="number" id="cy" value="${+y - 1 + 543}" style="width:7.3333rem"><button class="btn" id="cyb">ปิดบัญชีปีนี้</button></div>` : ''}${d.closings.length ? `<div class="list mt">${d.closings.map(c => `<div class="row" style="height:3.2rem;padding:0 0.2667rem"><div class="m"><b>ปิดบัญชีปี ${beYear(c.year)}</b><span>${esc(c.code)} · ${dd(c.doc_date)}</span></div><div class="e"><b>${money(c.total)}</b></div></div>`).join('')}</div>` : ''}</div>
    <div class="card pad0"><div style="padding:0.9333rem 1.0667rem 0"><h3>รายการต่อเดือน (สมุดรายวัน)</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>งวด</th><th class="num">รายการ</th><th class="num">มูลค่ารวม</th><th>สถานะ</th></tr></thead><tbody>${d.periods.map(p => `<tr><td class="b">${ymLabel(p.period)}</td><td class="num">${p.n}</td><td class="num">${money(p.total)}</td><td>${d.closed_through && p.period + '-31' <= d.closed_through + 'z' && p.period <= d.closed_through.slice(0, 7) ? '<span class="pill">🔒 ปิดแล้ว</span>' : '<span class="pill green">เปิด</span>'}</td></tr>`).join('')}</tbody></table></div></div></div>
    <div class="card mt"><h3>📚 เอกสารที่ต้องเก็บรักษา (ตามกฎหมายบัญชี)</h3><div class="grid g3 small"><div>• สมุดรายวันและบัญชีแยกประเภททุกเล่ม (ระบบเก็บถาวร ห้ามลบ ใช้การกลับรายการแทน)</div><div>• เอกสารประกอบการลงบัญชี: ใบกำกับภาษี ใบเสร็จ ใบสำคัญจ่าย (แนบรูปได้ที่ค่าใช้จ่าย)</div><div>• เก็บไว้ไม่น้อยกว่า 5 ปี นับแต่วันปิดบัญชี · งบการเงินต้องมีผู้ทำบัญชีและผู้สอบบัญชีรับอนุญาต</div></div></div>`;
  if (canClose) { $('#cl').onclick = async () => { const t = $('#thr').value; if (!t) return UI.err('เลือกวันที่'); if (!await UI.confirm('ปิดงวดบัญชี', `ล็อกรายการทั้งหมดถึง ${dd(t)}? หลังจากนี้จะเพิ่ม/แก้รายการก่อนวันดังกล่าวไม่ได้`)) return; try { await API.post('/finance/close', { through: t }); UI.ok('ปิดงวดแล้ว'); finClose(out); } catch (e) { UI.alert('ปิดงวดไม่ได้', esc(e.message)); } }; const re = $('#re'); if (re) re.onclick = async () => { if (!await UI.confirm('เปิดงวดใหม่', 'ยกเลิกการล็อกงวดทั้งหมด? (บันทึกใน audit log)')) return; await API.post('/finance/reopen', { through: '' }); finClose(out); }; $('#cyb').onclick = async () => { const yy = $('#cy').value - 543; if (!await UI.confirm('ปิดบัญชีประจำปี ' + (yy + 543), 'โอนกำไรขาดทุนทั้งปีเข้ากำไรสะสม รายการนี้ทำครั้งเดียวต่อปี', { danger: false })) return; try { const r = await API.post('/finance/close-year', { year: yy }); UI.alert('ปิดบัญชีปี ' + (yy + 543) + ' แล้ว', `กำไร (ขาดทุน) สุทธิ ${money(r.net_profit)} โอนเข้ากำไรสะสม`, { kind: 'success' }); finClose(out); } catch (e) { UI.alert('ปิดบัญชีไม่ได้', esc(e.message)); } }; }
}

<script>

   AC711 page: บุคคล & เงินเดือน — ทะเบียนพนักงาน / สิทธิ์ / การลา / เงินเดือน-ประกันสังคม / ประเมินผล / ของฉัน

const HRR = ['owner', 'hq_manager', 'hr', 'accountant'];
const isHR = () => HRR.includes(App.user.role);
const isMgrHR = () => isHR() || App.user.role === 'branch_manager';
const DEPTS = ['ขาย', 'คลังสินค้า', 'บัญชี', 'จัดซื้อ', 'การตลาด', 'บุคคล', 'บริหารสาขา', 'บริหาร', 'ทั่วไป'];
const EST = { probation: ['amber', 'ทดลองงาน'], active: ['green', 'พนักงานประจำ'], resigned: ['', 'ลาออกแล้ว'] };
const GRADE_C = { A: 'green', B: 'green', C: 'amber', D: 'red', E: 'red' };

Pages.hr = async (main, params) => {
  let tab = params.tab || (isMgrHR() ? 'overview' : 'me');
  main.innerHTML = head('บุคคล & เงินเดือน', 'ทะเบียนพนักงาน · รหัสพนักงาน · สิทธิ์การใช้ระบบ · การลา · เงินเดือน ประกันสังคม ภ.ง.ด.1 · ประเมินผลการปฏิบัติงาน') + '<div id="seg" class="mb"></div><div id="out"></div>';
  const tabs = [];
  if (isMgrHR()) tabs.push({ v: 'overview', l: '👥 ภาพรวม' }, { v: 'emp', l: '🪪 พนักงาน' });
  tabs.push({ v: 'perm', l: '🔐 สิทธิ์การใช้ระบบ' }, { v: 'leave', l: '🏖️ การลา' }); if (isMgrHR()) tabs.push({ v: 'time', l: '⏰ เวลาทำงาน' });
  if (isHR()) tabs.push({ v: 'payroll', l: '💵 เงินเดือน & ประกันสังคม' });
  if (isMgrHR()) tabs.push({ v: 'eval', l: '⭐ ประเมินผล' });
  tabs.push({ v: 'me', l: '🙋 ของฉัน' }); tabs.splice(0, tabs.length, ...App.tabs('hr', tabs));
  if (!tabs.some(t => t.v === tab)) tab = tabs[0].v;
  $('#seg').appendChild(UI.seg(tabs, tab, v => { tab = v; load(); }));

  const load = async () => { out.innerHTML = UI.loading(); try { await ({ overview: hrOverview, emp: hrEmployees, perm: hrPerms, leave: hrLeave, time: hrTime, payroll: hrPayroll, eval: hrEval, me: hrMe })[tab](out, params); } catch (e) { out.innerHTML = `<div class="card"><p class="red">${esc(e.message)}</p></div>`; } };

  load();
};

    <div class="grid g-2-1 mt"><div class="card pad0"><div style="padding:0.9333rem 1.0667rem 0"><h3>อัตรากำลังรายสาขา</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>สาขา</th><th class="num">พนักงาน</th><th class="num">ฐานเงินเดือนรวม/เดือน</th></tr></thead><tbody>${d.by_branch.map(b => `<tr><td>${esc(b.name)}</td><td class="num b">${b.n}</td><td class="num">${money(b.payroll)}</td></tr>`).join('')}</tbody></table></div></div>

    lessons: [

      { title: 'ฤดูกาลของอะไหล่แอร์และแบตเตอรี่', body: `ยอดขายอะไหล่แอร์จะพุ่งช่วง มีนาคม–พฤษภาคม (หน้าร้อน) สูงกว่าค่าเฉลี่ยราว 25–40% ส่วนแบตเตอรี่จะขายดีช่วงอากาศร้อนจัดและช่วงต้นหน้าหนาว\n\nแผนการตลาดควรเริ่ม "ก่อน" ฤดูกาล 4–6 สัปดาห์ เช่น แคมเปญ "ตรวจแอร์ฟรี" ปลายกุมภาพันธ์ เพื่อให้ลูกค้านึกถึงเราตอนแอร์เริ่มไม่เย็น\n\nระบบพยากรณ์ในเมนู "พยากรณ์ยอดขาย" ใช้ดัชนีฤดูกาลเดียวกันนี้ในการแนะนำจำนวนสั่งซื้อ` },
      { title: 'ช่องทางที่ใช้ได้ผลกับร้านอะไหล่', body: `• Facebook เพจสาขา: โพสต์ "ปัญหา → วิธีแก้ → สินค้า" วันละ 1 โพสต์ ช่วงเย็น 18:00–20:00\n• LINE OA: ใช้รับออเดอร์/ตอบคำถาม AI น้อง AC711 ตอบได้ 24 ชม. และบรอดแคสต์โปรโมชั่นเดือนละ 2 ครั้ง\n• TikTok: คลิปสั้น "เปลี่ยนกรองแอร์เอง 3 นาที" ยอดเข้าถึงสูงมากในกลุ่มเจ้าของรถ\n• Shopee/Lazada/TikTok Shop: ขายสินค้าชิ้นเล็กส่งง่าย (กรองแอร์ รีเลย์ หลอดไฟ)\n• ออฟไลน์: เยี่ยมอู่พร้อมแคตตาล็อกและราคาส่ง สร้างความสัมพันธ์ระยะยาว\n\nทุกกิจกรรมบันทึกใน MKT Think! เพื่อสะสม Marketing Point ของสาขา` },
    ],
    quiz: [
      { q: 'ลูกค้ากลุ่มใดสร้างยอดขายประจำและต้องการ "ความเร็ว" มากที่สุด', o: ['เจ้าของรถทั่วไป', 'อู่/ร้านซ่อมแอร์', 'ฟลีท/บริษัทขนส่ง', 'นักท่องเที่ยว'], a: 1, e: 'อู่ซื้อซ้ำบ่อยและต้องการของครบ ส่งไว' },
      { q: 'ยอดขายอะไหล่แอร์สูงสุดช่วงเดือนใด', o: ['ตุลาคม–ธันวาคม', 'มีนาคม–พฤษภาคม', 'มิถุนายน–สิงหาคม', 'มกราคม–กุมภาพันธ์'], a: 1 },
      { q: 'ควรเริ่มแคมเปญหน้าร้อนเมื่อใด', o: ['กลางเมษายน', 'ก่อนฤดูกาล 4–6 สัปดาห์', 'หลังฤดูกาล', 'เมื่อสต็อกเหลือมาก'], a: 1 },
    ] },
  { track: 'marketing', title: 'MKT Think! และ Marketing Point', level: 'พื้นฐาน', minutes: 15,
    description: 'วิธีบันทึกกิจกรรมการตลาด สะสมคะแนน และอ่านสรุปผลจากส่วนกลาง',
    lessons: [
      { title: 'Marketing Point คืออะไร', body: `Marketing Point คือคะแนนที่สาขาได้รับจากกิจกรรมการตลาดที่ทำจริง เช่น โพสต์เพจ (5 คะแนน) ไลฟ์สด (20) เยี่ยมอู่ (15) ออกบูธ (30)\n\nทุกกิจกรรมต้องแนบหลักฐาน (ลิงก์โพสต์/รูปถ่าย) ส่วนกลางจะตรวจสอบและยืนยัน คะแนนที่ยืนยันแล้วจะแสดงบนกระดาน MKT Think! และใช้ประกอบการประเมินสาขา\n\nหลักการ: "ทำจริง มีหลักฐาน วัดผลได้"` },
      { title: 'ใช้ AI สร้างคอนเทนต์', body: `ในเมนู MKT Think! → คอนเทนต์สตูดิโอ พิมพ์สินค้าและโปรโมชั่น AI จะร่างข้อความโพสต์ 3 แบบ (ขายตรง / ให้ความรู้ / เล่าเรื่อง) พร้อมแฮชแท็ก และออกแบบภาพโปสเตอร์ให้\n\nข้อควรระวัง: ตรวจราคาและเงื่อนไขก่อนโพสต์ทุกครั้ง ห้ามโพสต์ราคาที่ไม่ตรงกับระบบ และส่งโพสต์ให้ผู้จัดการอนุมัติก่อนเผยแพร่` },
    ],
    quiz: [
      { q: 'กิจกรรมใดได้ Marketing Point สูงสุด', o: ['โพสต์เพจ', 'ออกบูธ/กิจกรรมชุมชน', 'ขอรีวิว', 'บรอดแคสต์ LINE'], a: 1 },
      { q: 'ก่อนโพสต์คอนเทนต์ที่ AI สร้าง ต้องทำอะไร', o: ['โพสต์ทันที', 'ตรวจราคา/เงื่อนไข และส่งอนุมัติ', 'ลบแฮชแท็ก', 'เปลี่ยนชื่อสาขา'], a: 1 },
    ] },

  /* ================= การขาย ================= */
  { track: 'sales', title: 'ขายอะไหล่แอร์อย่างมืออาชีพ: ถามให้ถูก จ่ายให้ตรง', level: 'พื้นฐาน', minutes: 25,
    description: 'คำถาม 5 ข้อก่อนหยิบของ, การเช็ครุ่นรถ, การเสนอสินค้าคู่ (cross-sell)',
    lessons: [
      { title: 'คำถาม 5 ข้อก่อนหยิบของ', body: `1) รถยี่ห้อ/รุ่น/ปีอะไร (ดูจากเล่มทะเบียนหรือถามเลขตัวถัง)\n2) อาการเป็นอย่างไร — แอร์ไม่เย็นเลย / เย็นช้า / มีเสียงดัง / มีกลิ่น\n3) เคยซ่อมอะไรมาก่อน\n4) ต้องการของแท้ OEM หรือเทียบ\n5) ซื้อไปติดตั้งเองหรือให้อู่ติด\n\nใช้เมนู "สินค้า" ค้นหาด้วยรุ่นรถ ระบบจะแสดงอะไหล่ที่ใส่ได้ (fitment) และสต็อกทุกสาขาแบบเรียลไทม์` },
      { title: 'เสนอสินค้าคู่กันเสมอ', body: `เปลี่ยนคอมเพรสเซอร์ → ต้องเปลี่ยนไดเออร์ + วาล์วแอร์ + น้ำมันคอม + ล้างระบบ (ถ้าไม่เปลี่ยนไดเออร์ คอมใหม่อาจพังเพราะความชื้น และหมดประกัน)\nเปลี่ยนแบตเตอรี่ → เสนอตรวจไดชาร์จฟรี\nเปลี่ยนโบลเวอร์ → เสนอกรองแอร์ (ฝุ่นคือสาเหตุที่ทำให้โบลเวอร์พัง)\n\nการเสนอสินค้าคู่ไม่ใช่การยัดเยียด แต่คือการป้องกันลูกค้ากลับมาซ่อมซ้ำ` },
      { title: 'การรับประกันและการเคลม', body: `คอมเพรสเซอร์รับประกัน 12 เดือน เงื่อนไข: ต้องเปลี่ยนไดเออร์และล้างระบบ (มีใบเสร็จ), ไม่ประกันกรณีน้ำยาหมดจากรั่ว\nแบตเตอรี่รับประกัน 12–18 เดือนตามยี่ห้อ ต้องมีบิลและวันที่ติดตั้ง\n\nการเคลมทุกครั้งต้องเปิดเอกสาร "คืน/เคลม" ในระบบ ให้ผู้จัดการสาขาอนุมัติ ห้ามรับคืนเงินสดโดยไม่มีเอกสาร` },
    ],
    quiz: [
      { q: 'เปลี่ยนคอมเพรสเซอร์ ควรเสนออะไรคู่กัน', o: ['หลอดไฟหน้า', 'ไดเออร์ + วาล์วแอร์ + น้ำมันคอม', 'แบตเตอรี่', 'พัดลมหม้อน้ำ'], a: 1 },
      { q: 'ลูกค้าขอคืนเงินสดโดยไม่มีเอกสาร ควรทำอย่างไร', o: ['คืนได้ทันที', 'เปิดเอกสารคืน/เคลม ให้ผู้จัดการอนุมัติ', 'ให้ส่วนลดแทน', 'ปฏิเสธทุกกรณี'], a: 1 },
      { q: 'ข้อมูลแรกที่ต้องถามลูกค้าคืออะไร', o: ['งบประมาณ', 'ยี่ห้อ/รุ่น/ปีรถ', 'สีรถ', 'ชื่อลูกค้า'], a: 1 },
    ] },
  { track: 'sales', title: 'การใช้งาน POS และการรับชำระเงิน', level: 'พื้นฐาน', minutes: 15,
    description: 'ยิงบาร์โค้ด เปิดบิล รับเงินสด/โอน/PromptPay การยกเลิกบิล และการปิดกะ',
    lessons: [
      { title: 'ขั้นตอนเปิดบิล', body: `1) เข้าเมนู POS → ยิงบาร์โค้ดหรือพิมพ์ชื่อ/SKU/รุ่นรถ\n2) ตรวจจำนวนและราคา (ราคาส่งจะขึ้นอัตโนมัติเมื่อเลือกลูกค้ากลุ่มอู่/ขายส่ง)\n3) เลือกวิธีชำระ: เงินสด (ระบบคำนวณเงินทอน) / โอน / PromptPay (ระบบสร้าง QR พร้อมยอด)\n4) กด "ชำระเงิน" → พิมพ์ใบเสร็จ\n\nสต็อกจะตัดทันทีแบบ FIFO (ล็อตเก่าออกก่อน) หรือ FEFO (ใกล้หมดอายุออกก่อน) โดยอัตโนมัติ` },
      { title: 'ยกเลิกบิล ส่วนลด และการปิดกะ', body: `• ยกเลิกบิลหลังชำระแล้ว ต้องขออนุมัติผู้จัดการ (ระบบส่งคำขอให้อัตโนมัติ) ห้ามลบบิล\n• ส่วนลดเกิน 10% ต้องขออนุมัติ\n• ปิดกะ: ตรวจเงินสดในลิ้นชักให้ตรงกับรายงาน หากไม่ตรงบันทึกเหตุผล\n\nทุกการกระทำถูกบันทึกในบันทึกตรวจสอบ (Audit Log) ที่แก้ไขย้อนหลังไม่ได้` },
    ],
    quiz: [
      { q: 'สต็อกสินค้าที่มีวันหมดอายุจะถูกตัดแบบใด', o: ['สุ่ม', 'FEFO ใกล้หมดอายุออกก่อน', 'ล็อตใหม่ออกก่อน', 'ไม่ตัดสต็อก'], a: 1 },
      { q: 'ส่วนลดเท่าไรที่ต้องขออนุมัติ', o: ['ทุกส่วนลด', 'เกิน 10%', 'เกิน 50%', 'ไม่ต้องขอ'], a: 1 },
    ] },

  /* ================= สินค้า ================= */
  { track: 'product', title: 'ระบบปรับอากาศรถยนต์ 101: ชิ้นส่วน หน้าที่ และอาการเสีย', level: 'พื้นฐาน', minutes: 30,
    description: 'คอมเพรสเซอร์ แผงแอร์ ไดเออร์ วาล์ว ตู้แอร์ โบลเวอร์ — ทำงานอย่างไร เสียแล้วมีอาการอย่างไร',
    lessons: [
      { title: 'วงจรน้ำยาแอร์', body: `คอมเพรสเซอร์ (อัดน้ำยาเป็นแก๊สร้อนแรงดันสูง) → แผงแอร์/คอนเดนเซอร์หน้ารถ (ระบายความร้อนให้กลายเป็นของเหลว) → ไดเออร์ (กรองความชื้น/สิ่งสกปรก) → วาล์วแอร์/เอ็กซ์แพนชั่น (ลดแรงดันให้น้ำยาเย็นจัด) → ตู้แอร์/คอยล์เย็นในห้องโดยสาร (โบลเวอร์เป่าลมผ่านให้เย็น) → กลับคอมเพรสเซอร์\n\nน้ำยาที่ใช้: R134a (รถส่วนใหญ่ 1995–2020) และ R1234yf (รถใหม่/EV บางรุ่น) ห้ามผสมกัน` },
      { title: 'อาการเสีย → ชิ้นส่วนที่น่าสงสัย', body: `• แอร์ไม่เย็นเลย คอมไม่ทำงาน → หน้าคลัทช์/รีเลย์/สวิตช์แรงดัน/น้ำยาหมด\n• เย็นบ้างไม่เย็นบ้าง → วาล์วแอร์ตัน / ไดเออร์อุดตัน / พัดลมแผงแอร์ไม่หมุน\n• ลมอ่อน → กรองแอร์ตัน / โบลเวอร์เสื่อม / รีซิสเตอร์เสีย (ลมแรงได้เบอร์เดียว)\n• มีเสียงดังจากคอม → ลูกปืนหน้าคลัทช์ / คอมเพรสเซอร์ภายในเสีย\n• มีกลิ่นอับ → ตู้แอร์สกปรก / กรองแอร์เก่า\n\nตอบลูกค้าด้วยความเป็นไปได้ ไม่ฟันธง แนะนำให้ช่างตรวจแรงดันน้ำยาก่อน` },
      { title: 'อ่านรหัสคอมเพรสเซอร์ Denso', body: `10S11C / 10S15C / 10S17C: ตัวเลขหน้า = จำนวนลูกสูบ (10), S = ซีรีส์, 11/15/17 = ขนาดปริมาตร (cc ×10) — ยิ่งเลขมากยิ่งเหมาะกับรถใหญ่/ห้องโดยสารใหญ่\n10PA15C/10PA17C: รุ่นเก่ากว่า ใช้ในรถยุค 90s–2000s\n10SRE13C / 10SRE18C: ซีรีส์ใหม่ใช้ใน D-Max 2012+, Revo, Fortuner ใหม่\n\nสิ่งที่ต้องเช็คก่อนขาย: จำนวนร่องพูลเลย์ (4PK/6PK/7PK), ขนาดพูลเลย์, ทางเข้า-ออกท่อ, ขั้วปลั๊กหน้าคลัทช์` },
    ],
    quiz: [
      { q: 'ชิ้นส่วนใดทำหน้าที่กรองความชื้นในระบบแอร์', o: ['โบลเวอร์', 'ไดเออร์', 'คอนเดนเซอร์', 'รีเลย์'], a: 1 },
      { q: 'ลมแอร์แรงได้เบอร์เดียว น่าจะเกิดจาก', o: ['น้ำยาหมด', 'รีซิสเตอร์โบลเวอร์เสีย', 'แผงแอร์ตัน', 'คอมเพรสเซอร์พัง'], a: 1 },
      { q: 'ใน 10S15C เลข 15 หมายถึง', o: ['ปีผลิต', 'ขนาดปริมาตร (cc×10)', 'จำนวนร่องพูลเลย์', 'แรงดัน'], a: 1 },
    ] },
  { track: 'product', title: 'แบตเตอรี่รถยนต์: อ่านรหัส เลือกขนาด และการดูแลสต็อก (FEFO)', level: 'พื้นฐาน', minutes: 20,
    description: 'รหัส JIS/DIN, แบตน้ำ-กึ่งแห้ง-แห้ง-EFB/AGM, การตรวจแรงดันและวันผลิต',
